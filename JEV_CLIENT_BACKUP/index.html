<head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Heiti SC", "SimHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    /* Aurora 动态背景层 */
    #aurora-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(at 20% 30%, rgba(99,102,241,0.25), transparent 70%),
                  radial-gradient(at 80% 70%, rgba(236,72,153,0.25), transparent 70%),
                  linear-gradient(120deg, rgba(56,189,248,0.1), rgba(147,51,234,0.15));
      backdrop-filter: blur(140px) saturate(150%);
      filter: brightness(1.05);
      animation: auroraFlow 18s ease-in-out infinite alternate;
      z-index: -10;
    }
    @keyframes auroraFlow {
      0% { transform: scale(1.0) translateY(0); filter: hue-rotate(0deg); }
      50% { transform: scale(1.05) translateY(-20px); filter: hue-rotate(20deg); }
      100% { transform: scale(1.1) translateY(10px); filter: hue-rotate(40deg); }
    }
    
    /* 动态光晕层（Glow Ring） */
    #glow-ring {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(147,51,234,0.3) 0%, rgba(59,130,246,0.1) 70%, transparent 100%);
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.6;
      animation: ringFloat 10s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes ringFloat {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
      50% { transform: translate(-50%, -52%) scale(1.1); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    }

    /* 卡片：玻璃拟态 + 呼吸边光 */
    .card {
      backdrop-filter: blur(20px) saturate(160%);
      background: rgba(255,255,255,0.35);
      box-shadow: 0 20px 50px rgba(99,102,241,0.2), 0 0 60px rgba(147,51,234,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 1.5rem;
      transition: all 0.6s ease;
      animation: cardPulse 8s ease-in-out infinite;
    }
    @keyframes cardPulse {
      0%,100% { box-shadow: 0 15px 45px rgba(99,102,241,0.25), 0 0 60px rgba(147,51,234,0.2); }
      50% { box-shadow: 0 25px 80px rgba(236,72,153,0.25), 0 0 120px rgba(99,102,241,0.25); }
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    /* 按钮：玻璃渐变 + 微光呼吸 */
    .btn-glass {
      backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(135deg, rgba(59,130,246,0.5), rgba(147,51,234,0.5));
      color: white;
      border-radius: 0.75rem;
      padding: 0.6rem 1.2rem;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
      transition: all 0.4s ease;
    }
    .btn-glass:hover {
      background: linear-gradient(135deg, rgba(236,72,153,0.6), rgba(99,102,241,0.6));
      box-shadow: 0 8px 25px rgba(236,72,153,0.35);
      transform: translateY(-2px);
    }
    
    /* 加载容器样式调整 */
    #loading-container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(99,102,241,0.15);
    }
    
    /* 粒子画布样式 */
    #aurora-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -5;
    }
  </style>
  <script src="main.js" defer></script>

  <!-- SafeBoot + ManualRecovery -->
  <script>
  (() => {

        app.classList.remove('hidden');

        app.style.transition='opacity 0.8s ease-in-out';
        console.log('[JEV UltimateBoot] 页面已恢复 ✅');

  })();
  </script>
  
  <!-- 粒子漂浮层 -->
  <canvas id="aurora-particles"></canvas>
  <script>
  const canvas = document.getElementById('aurora-particles');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const particles = Array.from({length: 40}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 1,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    c: `hsla(${Math.random()*360},70%,70%,0.3)`
  }));
  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if(p.x<0||p.x>canvas.width) p.dx*=-1;
      if(p.y<0||p.y>canvas.height) p.dy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c; ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight;});
  </script>
