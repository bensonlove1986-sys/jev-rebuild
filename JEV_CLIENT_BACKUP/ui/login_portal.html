<!DOCTYPE html><html lang="zh-CN"><head>
<!-- UTF-8 FIXED BY JEV @ 2025-11-09T15:11:18.013Z -->  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>JEV Client 登录门户</title>  <style>    body {      font-family: "Noto Sans SC", sans-serif;      display: flex;      justify-content: center;      align-items: center;      height: 100vh;      background: linear-gradient(135deg, #f0f3f7, #cdd8e3);    }    .login-box {      background: white;      padding: 40px;      border-radius: 16px;      box-shadow: 0 4px 20px rgba(0,0,0,0.1);      text-align: center;    }    input {      width: 200px;      padding: 8px;      margin-top: 10px;      border: 1px solid #ccc;      border-radius: 8px;    }    button {      margin-top: 15px;      padding: 8px 20px;      cursor: pointer;      border: none;      border-radius: 8px;      background-color: #0078ff;      color: #fff;      transition: 0.2s;    }    button:hover {      background-color: #005cd6;    }  </style></head><body>  <div class="login-box">    <h2>JEV Client 登录</h2>    <input id="inviteCode" placeholder="请输入邀请码">    <button onclick="verifyInvite()">验证</button>    <p id="result"></p>  </div>  <script>    async function verifyInvite() {      const code = document.getElementById("inviteCode").value.trim();      if (!code) {        alert("请输入邀请码");        return;      }      try {         const res = await fetch('/verify?code=' + encodeURIComponent(code));        const data = await res.json();        document.getElementById("result").innerText =          data.success ? "✅ 验证成功" : "❌ 无效的邀请码";      } catch (e) {        alert("验证失败：" + e.message);      }    }  </script></body></html>
