<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV Plugin v2.0 - 自修复与更新控制面板</title>
    <link rel="stylesheet" href="../control_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .dashboard-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            color: white;
            font-size: 1.3em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .control-panel {
            margin: 30px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-success {
            background: rgba(72, 187, 120, 0.3);
            border-color: rgba(72, 187, 120, 0.5);
        }

        .btn-success:hover {
            background: rgba(72, 187, 120, 0.4);
        }

        .btn-warning {
            background: rgba(252, 165, 165, 0.3);
            border-color: rgba(252, 165, 165, 0.5);
        }

        .btn-warning:hover {
            background: rgba(252, 165, 165, 0.4);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: rgba(72, 187, 120, 0.7);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            color: white;
            font-size: 1.1em;
        }

        .log-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .log-success {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .log-error {
            background: rgba(252, 165, 165, 0.2);
            color: #fc8585;
        }

        .module-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .module-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.3s ease;
        }

        .module-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .module-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-healthy {
            background-color: #48bb78;
        }

        .status-corrupted {
            background-color: #fc8585;
        }

        .status-unknown {
            background-color: #a0aec0;
        }

        .module-info {
            flex: 1;
        }

        .module-name {
            font-weight: 500;
            color: white;
        }

        .module-version {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .update-item {
            background: rgba(255, 214, 0, 0.2);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #ffd600;
        }

        .update-title {
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
        }

        .update-version {
            font-size: 0.9em;
            color: #ffd600;
        }

        .update-date {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
        }

        .refresh-indicator {
            margin-left: 10px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1>🔧 JEV Plugin v2.0 自修复与智能更新系统</h1>
            <p>自动化监控、修复与热更新控制面板</p>
        </div>

        <div class="toggle-container">
            <span>自动修复模式</span>
            <label class="toggle-switch">
                <input type="checkbox" id="autoRepairToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <span id="autoRepairStatus">已启用</span>
        </div>

        <div class="control-panel">
            <button class="btn btn-success" id="checkIntegrityBtn">🔍 检查完整性</button>
            <button class="btn btn-warning" id="repairAllBtn">⚙️ 立即修复所有</button>
            <button class="btn" id="downloadUpdatesBtn">🔄 下载更新</button>
            <button class="btn" id="rollbackBtn">⏪ 回滚上一个版本</button>
        </div>

        <div class="dashboard-grid">
            <div class="glass-card">
                <h3 class="card-title">📊 系统状态</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalModules">5</div>
                        <div class="stat-label">模块总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="healthyModules">5</div>
                        <div class="stat-label">健康模块</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="corruptedModules">0</div>
                        <div class="stat-label">异常模块</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="integrityRate">100.00%</div>
                        <div class="stat-label">完整率</div>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="integrityBar" style="width: 100%"></div>
                </div>
                <div class="chart-container">
                    <canvas id="integrityChart"></canvas>
                </div>
            </div>

            <div class="glass-card">
                <h3 class="card-title">🔍 模块扫描状态</h3>
                <ul class="module-list" id="moduleStatusList">
                    <!-- 模块状态将通过JavaScript动态填充 -->
                </ul>
            </div>

            <div class="glass-card">
                <h3 class="card-title">⚙️ 最新修复记录</h3>
                <div class="log-section" id="repairLogSection">
                    <!-- 修复日志将通过JavaScript动态填充 -->
                </div>
            </div>

            <div class="glass-card">
                <h3 class="card-title">🔄 可用更新列表</h3>
                <div id="updatesList">
                    <!-- 更新列表将通过JavaScript动态填充 -->
                    <div style="text-align: center; color: white; padding: 40px 0;">
                        <p>暂无可用更新</p>
                        <p style="font-size: 0.9em; color: rgba(255, 255, 255, 0.7);">当前版本: v2.0.6</p>
                    </div>
                </div>
            </div>

            <div class="glass-card full-width">
                <h3 class="card-title">🧩 模块完整率趋势</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let autoRepairEnabled = true;
        let integrityChart, trendChart;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initializeCharts();
            loadModuleStatus();
            loadRepairLogs();
            setupEventListeners();
        });

        // 初始化图表
        function initializeCharts() {
            // 完整性图表
            const integrityCtx = document.getElementById('integrityChart').getContext('2d');
            integrityChart = new Chart(integrityCtx, {
                type: 'doughnut',
                data: {
                    labels: ['健康模块', '异常模块'],
                    datasets: [{
                        data: [5, 0],
                        backgroundColor: [
                            'rgba(72, 187, 120, 0.8)',
                            'rgba(252, 165, 165, 0.8)'
                        ],
                        borderColor: [
                            'rgba(255, 255, 255, 0.3)',
                            'rgba(255, 255, 255, 0.3)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: 'white',
                                font: {
                                    size: 12
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });

            // 趋势图表
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00'],
                    datasets: [{
                        label: '模块完整率 (%)',
                        data: [100, 98, 100, 100, 99, 100, 100],
                        borderColor: 'rgba(72, 187, 120, 1)',
                        backgroundColor: 'rgba(72, 187, 120, 0.2)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 90,
                            max: 100,
                            ticks: {
                                color: 'rgba(255, 255, 255, 0.8)'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: 'rgba(255, 255, 255, 0.8)'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    }
                }
            });
        }

        // 加载模块状态
        function loadModuleStatus() {
            const moduleList = document.getElementById('moduleStatusList');
            const modules = [
                { name: 'ai_responder.js', version: '2.0.6', status: 'healthy' },
                { name: 'ocr_engine.js', version: '2.0.6', status: 'healthy' },
                { name: 'relay_connector.js', version: '2.0.6', status: 'healthy' },
                { name: 'storage_manager.js', version: '2.0.6', status: 'healthy' },
                { name: 'toggle_manager.js', version: '2.0.6', status: 'healthy' }
            ];

            moduleList.innerHTML = '';
            
            modules.forEach(module => {
                const item = document.createElement('li');
                item.className = 'module-item';
                
                const statusClass = module.status === 'healthy' ? 'status-healthy' : 
                                  module.status === 'corrupted' ? 'status-corrupted' : 'status-unknown';
                const statusText = module.status === 'healthy' ? '健康' : 
                                  module.status === 'corrupted' ? '异常' : '未知';
                
                item.innerHTML = `
                    <span class="module-status ${statusClass}"></span>
                    <div class="module-info">
                        <div class="module-name">${module.name}</div>
                        <div class="module-version">v${module.version} | ${statusText}</div>
                    </div>
                `;
                
                moduleList.appendChild(item);
            });
        }

        // 加载修复日志
        function loadRepairLogs() {
            const logSection = document.getElementById('repairLogSection');
            const logs = [
                '[2025-11-09 03:10:42] ✅ 修复成功 | 模块: ai_responder.js | 原因: 缺失文件 | 操作: 重新下载并验证通过',
                '[2025-11-08 14:25:30] ✅ 更新成功 | 模块: relay_connector.js | 版本: 2.0.5 → 2.0.6 | 状态: 热更新完成',
                '[2025-11-07 09:40:15] ⚠️ 校验失败 | 模块: ocr_engine.js | 原因: 文件哈希不匹配 | 操作: 等待修复',
                '[2025-11-06 22:10:55] ✅ 修复成功 | 模块: storage_manager.js | 原因: 文件损坏 | 操作: 替换并验证通过',
                '[2025-11-05 16:30:22] ✅ 回滚成功 | 模块: toggle_manager.js | 版本: 2.0.6 → 2.0.5 | 原因: 新版本兼容性问题'
            ];

            logSection.innerHTML = '';
            
            logs.forEach(log => {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.className += log.includes('✅') ? ' log-success' : ' log-error';
                entry.textContent = log;
                logSection.appendChild(entry);
            });
        }

        // 设置事件监听
        function setupEventListeners() {
            // 自动修复开关
            document.getElementById('autoRepairToggle').addEventListener('change', function() {
                autoRepairEnabled = this.checked;
                document.getElementById('autoRepairStatus').textContent = autoRepairEnabled ? '已启用' : '已禁用';
                
                // 模拟API调用切换自动修复模式
                console.log(`自动修复模式已${autoRepairEnabled ? '启用' : '禁用'}`);
            });

            // 检查完整性
            document.getElementById('checkIntegrityBtn').addEventListener('click', function() {
                const refreshIndicator = document.createElement('span');
                refreshIndicator.className = 'refresh-indicator';
                refreshIndicator.textContent = '🔄';
                this.appendChild(refreshIndicator);
                this.disabled = true;
                
                // 模拟检查操作
                setTimeout(() => {
                    alert('完整性检查完成！所有模块状态正常。');
                    this.removeChild(refreshIndicator);
                    this.disabled = false;
                }, 2000);
            });

            // 立即修复所有
            document.getElementById('repairAllBtn').addEventListener('click', function() {
                if (confirm('确定要执行全面修复吗？这可能会影响正在运行的服务。')) {
                    const refreshIndicator = document.createElement('span');
                    refreshIndicator.className = 'refresh-indicator';
                    refreshIndicator.textContent = '🔄';
                    this.appendChild(refreshIndicator);
                    this.disabled = true;
                    
                    // 模拟修复操作
                    setTimeout(() => {
                        alert('全面修复完成！所有异常模块已修复。');
                        this.removeChild(refreshIndicator);
                        this.disabled = false;
                        loadModuleStatus();
                    }, 3000);
                }
            });

            // 下载更新
            document.getElementById('downloadUpdatesBtn').addEventListener('click', function() {
                const refreshIndicator = document.createElement('span');
                refreshIndicator.className = 'refresh-indicator';
                refreshIndicator.textContent = '🔄';
                this.appendChild(refreshIndicator);
                this.disabled = true;
                
                // 模拟下载操作
                setTimeout(() => {
                    alert('检查更新完成！所有模块已是最新版本。');
                    this.removeChild(refreshIndicator);
                    this.disabled = false;
                }, 2000);
            });

            // 回滚版本
            document.getElementById('rollbackBtn').addEventListener('click', function() {
                if (confirm('确定要回滚到上一个版本吗？这可能会丢失最新功能。')) {
                    const refreshIndicator = document.createElement('span');
                    refreshIndicator.className = 'refresh-indicator';
                    refreshIndicator.textContent = '🔄';
                    this.appendChild(refreshIndicator);
                    this.disabled = true;
                    
                    // 模拟回滚操作
                    setTimeout(() => {
                        alert('回滚完成！系统已恢复到上一个稳定版本。');
                        this.removeChild(refreshIndicator);
                        this.disabled = false;
                        loadRepairLogs();
                    }, 2500);
                }
            });
        }

        // 模拟实时数据更新
        setInterval(() => {
            // 更新趋势图数据
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes().toString().padStart(2, '0');
            const currentTime = `${currentHour}:${currentMinute}`;
            
            // 移除最早的数据点并添加新的数据点
            if (trendChart.data.labels.length > 7) {
                trendChart.data.labels.shift();
                trendChart.data.datasets[0].data.shift();
            }
            
            // 添加新数据点（随机波动）
            const lastValue = trendChart.data.datasets[0].data[trendChart.data.datasets[0].data.length - 1];
            const newValue = Math.max(98, Math.min(100, lastValue + (Math.random() - 0.5) * 0.5));
            
            trendChart.data.labels.push(currentTime);
            trendChart.data.datasets[0].data.push(newValue);
            trendChart.update();
        }, 30000); // 每30秒更新一次
    </script>
</body>
</html>
