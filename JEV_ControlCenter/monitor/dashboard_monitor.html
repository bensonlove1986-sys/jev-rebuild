<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV Plugin v2.0 - 监控仪表盘</title>
    <link rel="stylesheet" href="../control_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .status-indicator {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .status-OK {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 2px solid #4caf50;
        }
        
        .status-WARNING {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 2px solid #ffc107;
        }
        
        .status-CRITICAL {
            background-color: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 2px solid #f44336;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .metric-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }
        
        .chart-title {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .logs-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }
        
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .log-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .export-btn {
            padding: 8px 16px;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            border-radius: 8px;
            color: #2196f3;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .export-btn:hover {
            background: #2196f3;
            color: white;
        }
        
        .refresh-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #4caf50;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .last-update {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 顶部标题和状态 -->
        <div class="glass-card">
            <h1>JEV Plugin v2.0 监控仪表盘</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="status-indicator" id="system-status">🟢 正常</div>
                <div class="refresh-indicator" id="refresh-indicator"></div>
                <div class="last-update" id="last-update">最后更新: -</div>
            </div>
        </div>
        
        <!-- 指标卡片 -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">云端在线率</div>
                <div class="metric-value" id="cloud-rate">0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Worker响应延迟</div>
                <div class="metric-value" id="worker-latency">0ms</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">插件调用错误率</div>
                <div class="metric-value" id="plugin-error-rate">0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">活跃客户端数</div>
                <div class="metric-value" id="active-clients">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">24小时报警数</div>
                <div class="metric-value" id="alerts-count">0</div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">Worker延迟趋势</div>
                <canvas id="latency-chart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">错误类型分布</div>
                <canvas id="error-chart"></canvas>
            </div>
        </div>
        
        <!-- 报警日志 -->
        <div class="logs-container">
            <div class="logs-header">
                <h3>最近报警日志</h3>
                <button class="export-btn" onclick="exportLogs()">导出日志</button>
            </div>
            <div id="alerts-list">
                <!-- 日志内容将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // 全局配置
        const config = {
            healthEndpoint: 'system_health.json',
            alertsEndpoint: 'alerts_log.txt',
            refreshInterval: 10000 // 10秒
        };

        // 图表实例
        let latencyChart, errorChart;

        // 初始化页面
        function initializeDashboard() {
            initCharts();
            loadHealthData();
            loadAlerts();
            startAutoRefresh();
        }

        // 初始化图表
        function initCharts() {
            // 延迟趋势图
            const latencyCtx = document.getElementById('latency-chart').getContext('2d');
            latencyChart = new Chart(latencyCtx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        label: '响应延迟 (ms)',
                        data: Array(24).fill(0).map(() => Math.floor(Math.random() * 500) + 100),
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // 错误分布饼图
            const errorCtx = document.getElementById('error-chart').getContext('2d');
            errorChart = new Chart(errorCtx, {
                type: 'doughnut',
                data: {
                    labels: ['timeout', 'error', 'failed', 'unauthorized', 'disconnect'],
                    datasets: [{
                        data: [5, 8, 3, 2, 10],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // 加载健康数据
        async function loadHealthData() {
            try {
                const response = await fetch(config.healthEndpoint);
                if (!response.ok) throw new Error('网络响应失败');
                
                const healthData = await response.json();
                updateHealthUI(healthData);
                updateLastUpdate();
            } catch (error) {
                console.error('加载健康数据失败:', error);
                // 模拟数据展示
                const mockData = {
                    status: 'OK',
                    cloud_online_rate: 98.5,
                    worker_latency_avg: 450,
                    plugin_error_rate: 1.2,
                    active_clients: 12,
                    alerts_last_24h: 3
                };
                updateHealthUI(mockData);
            }
        }

        // 更新健康数据UI
        function updateHealthUI(data) {
            // 更新状态指示器
            const statusEl = document.getElementById('system-status');
            let statusIcon, statusText, statusClass;
            
            switch (data.status) {
                case 'CRITICAL':
                    statusIcon = '🔴';
                    statusText = '危险';
                    statusClass = 'status-CRITICAL';
                    break;
                case 'WARNING':
                    statusIcon = '🟡';
                    statusText = '警告';
                    statusClass = 'status-WARNING';
                    break;
                default:
                    statusIcon = '🟢';
                    statusText = '正常';
                    statusClass = 'status-OK';
            }
            
            statusEl.textContent = `${statusIcon} ${statusText}`;
            statusEl.className = 'status-indicator ' + statusClass;
            
            // 更新指标值
            document.getElementById('cloud-rate').textContent = `${data.cloud_online_rate?.toFixed(1)}%`;
            document.getElementById('worker-latency').textContent = `${data.worker_latency_avg}ms`;
            document.getElementById('plugin-error-rate').textContent = `${data.plugin_error_rate?.toFixed(2)}%`;
            document.getElementById('active-clients').textContent = data.active_clients;
            document.getElementById('alerts-count').textContent = data.alerts_last_24h;
            
            // 模拟更新图表数据
            if (latencyChart) {
                latencyChart.data.datasets[0].data = Array(24).fill(0).map(() => 
                    Math.floor(Math.random() * 500) + 100
                );
                latencyChart.update();
            }
        }

        // 加载报警日志
        async function loadAlerts() {
            try {
                const response = await fetch(config.alertsEndpoint);
                if (!response.ok) throw new Error('网络响应失败');
                
                const logs = await response.text();
                const logLines = logs.split('\n').filter(line => line.includes('⚠️'));
                const recentLogs = logLines.slice(-10).reverse();
                
                updateAlertsList(recentLogs);
            } catch (error) {
                console.error('加载报警日志失败:', error);
                // 显示模拟日志
                const mockLogs = [
                    '[2025-11-09 10:52:30] ⚠️ [ERR_TIMEOUT] Cloud 模块延迟超标 (平均 6800ms)',
                    '[2025-11-09 09:15:42] ⚠️ [ERR_403] 检测到未授权访问尝试 (来源: 192.168.1.100)',
                    '[2025-11-09 08:30:15] ⚠️ [ERR_CONN] 客户端连接断开 (CX001)',
                    '[2025-11-09 07:45:22] ⚠️ [ERR_ERROR] 插件执行错误 (模块: data_processor)',
                    '[2025-11-09 06:20:10] ⚠️ [ERR_FAILED] Worker 启动失败 (尝试3次)'
                ];
                updateAlertsList(mockLogs);
            }
        }

        // 更新报警日志列表
        function updateAlertsList(logs) {
            const alertsList = document.getElementById('alerts-list');
            alertsList.innerHTML = '';
            
            logs.forEach(log => {
                const logItem = document.createElement('div');
                logItem.className = 'log-item';
                logItem.textContent = log;
                alertsList.appendChild(logItem);
            });
        }

        // 导出日志
        function exportLogs() {
            // 创建一个临时链接下载日志文件
            const a = document.createElement('a');
            a.href = config.alertsEndpoint;
            a.download = `alerts_log_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 更新最后更新时间
        function updateLastUpdate() {
            const now = new Date().toLocaleString('zh-CN');
            document.getElementById('last-update').textContent = `最后更新: ${now}`;
        }

        // 启动自动刷新
        function startAutoRefresh() {
            setInterval(() => {
                loadHealthData();
                loadAlerts();
            }, config.refreshInterval);
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>
</html>
