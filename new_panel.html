<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 控制面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        /* 侧边栏样式 */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .sidebar-nav {
            list-style: none;
        }
        
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        
        .sidebar-nav a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .sidebar-nav a:hover {
            background-color: #34495e;
        }
        
        /* 主内容区样式 */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        /* 头部状态条 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-dot.connected {
            background-color: #27ae60;
        }
        
        .status-dot.disconnected {
            background-color: #e74c3c;
        }
        
        /* 聊天界面样式 */
        .chat-container {
            display: flex;
            height: calc(100vh - 150px);
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .chat-list {
            width: 250px;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }
        
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .chat-item:hover {
            background-color: #f9f9f9;
        }
        
        .chat-item.active {
            background-color: #e3f2fd;
        }
        
        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            background-color: #f8f8f8;
        }
        
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .message-input {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
        }
        
        .message-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        .message-input button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .message-input button:hover {
            background-color: #2980b9;
        }
        
        /* 登录界面样式 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-form {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 400px;
        }
        
        .login-form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .form-group button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        .form-group button:hover {
            background-color: #219a52;
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="login-screen" class="login-container">
        <div class="login-form">
            <h2>JEV 客户端登录</h2>
            <div class="form-group">
                <label for="license-key">许可证密钥</label>
                <input type="text" id="license-key" placeholder="请输入许可证密钥">
            </div>
            <div class="form-group">
                <button id="login-button">登录</button>
            </div>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- 主界面（初始隐藏） -->
    <div id="main-screen" class="container" style="display: none;">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <h2>JEV 控制面板</h2>
            <ul class="sidebar-nav">
                <li><a href="#dashboard">控制面板</a></li>
                <li><a href="#chat">消息中心</a></li>
                <li><a href="#settings">设置</a></li>
                <li><a href="#help">帮助</a></li>
            </ul>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 状态条 -->
            <div class="status-bar">
                <div class="status-indicator">
                    <span id="status-dot" class="status-dot disconnected"></span>
                    <span id="status-text">连接断开</span>
                    <span id="latency" class="latency">- ms</span>
                </div>
                <div id="user-info" class="user-info">
                    <span id="username">未登录</span>
                    <button id="logout-button">登出</button>
                </div>
            </div>
            
            <!-- 聊天界面 -->
            <div class="chat-container">
                <div class="chat-list">
                    <div class="chat-item active">
                        <div class="chat-name">系统消息</div>
                        <div class="chat-preview">欢迎使用JEV客户端</div>
                    </div>
                </div>
                
                <div class="chat-messages">
                    <div class="chat-header">
                        <h3 id="chat-title">系统消息</h3>
                    </div>
                    <div class="messages" id="chat-messages">
                        <p>欢迎使用JEV客户端，这是一个全新的界面。</p>
                    </div>
                    <div class="message-input">
                        <input type="text" id="chat-input" placeholder="输入消息...">
                        <button id="send-button">发送</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 通知容器 -->
    <div id="notification-container" class="notification-container"></div>

    <!-- 引入控制脚本 -->
    <script src="panel.js"></script>
</body>
</html>
