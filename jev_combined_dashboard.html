<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV L11C · 统一监控仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0c10 0%, #1a1d24 100%);
            color: #d1d5db;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(15, 17, 20, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .dashboard-header h1 {
            color: #00ffff;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            opacity: 0.7;
            font-size: 0.95rem;
        }

        /* 模块容器通用样式 */
        .monitor-module {
            background: rgba(15, 17, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        /* 系统监控样式 */
        #system-monitor {
            margin-bottom: 30px;
        }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            margin-bottom: 16px;
            color: #00ffff;
        }

        .monitor-status {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .monitor-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .monitor-card:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .monitor-title {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .monitor-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffff;
        }

        .monitor-alert {
            background: rgba(255, 204, 0, 0.1);
            border-left: 3px solid #ffcc00;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 12px;
        }

        /* 客服监控样式 */
        #agent-monitor {
            margin-bottom: 30px;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }

        .agent-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .agent-card:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .agent-name {
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .agent-meta {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .timeline {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.4em;
        }

        .timeline-item {
            border-left: 2px solid #00ffff33;
            padding-left: 8px;
            margin-bottom: 5px;
        }

        .timeline-item.ai {
            color: #00ffff;
        }

        .timeline-item.human {
            color: #ffcc00;
        }

        /* 刷新按钮 */
        .refresh-button {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
        }

        .refresh-button:active {
            transform: scale(0.97);
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 滚动条样式 */
        .timeline::-webkit-scrollbar {
            width: 4px;
        }

        .timeline::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 4px;
        }

        .timeline::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.5);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .dashboard-header h1 {
                font-size: 1.5rem;
            }

            .monitor-status,
            .agent-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>🔍 JEV L11C · 统一监控仪表板</h1>
            <p>系统健康状态与客服监控 - Privacy-by-Design 优先</p>
        </div>

        <!-- 系统监控模块 -->
        <div class="monitor-module" id="system-monitor">
            <div class="monitor-header">
                <span>🧠 系统监控中心</span>
                <div>
                    <span id="system-timestamp"></span>
                    <button class="refresh-button" onclick="refreshSystemMonitor()">🔄 刷新</button>
                </div>
            </div>
            <div class="monitor-status" id="system-status">
                <div class="monitor-card"><div class="monitor-title">Worker</div><div class="monitor-value" id="val-worker">--</div></div>
                <div class="monitor-card"><div class="monitor-title">KV 存储</div><div class="monitor-value" id="val-kv">--</div></div>
                <div class="monitor-card"><div class="monitor-title">Heartbeat</div><div class="monitor-value" id="val-heart">--</div></div>
                <div class="monitor-card"><div class="monitor-title">日志</div><div class="monitor-value" id="val-log">--</div></div>
            </div>
            <div id="system-alert"></div>
        </div>

        <!-- 客服监控模块 -->
        <div class="monitor-module" id="agent-monitor">
            <div class="monitor-header">
                <span>💬 客服监控中心</span>
                <div>
                    <span id="agent-timestamp"></span>
                    <button class="refresh-button" onclick="refreshAgentMonitor()">🔄 刷新</button>
                </div>
            </div>
            <div id="agent-status" class="agent-grid">
                <div class="agent-card">
                    <div class="agent-name">加载中...</div>
                    <div class="agent-meta">
                        正在获取客服状态数据...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 常量定义
        const API_BASE = "https://jevshop.bensonlove1986.workers.dev/";
        const SYSTEM_CHECK_INTERVAL = 15000; // 15秒刷新
        const AGENT_CHECK_INTERVAL = 20000;   // 20秒刷新
        let lastHeartbeat = 0;
        let systemIntervalId = null;
        let agentIntervalId = null;

        // 系统监控功能
        function setValue(id, val, ok = true) {
            const el = document.getElementById(id);
            if (el) {
                el.textContent = val;
                el.style.color = ok ? "#00ffff" : "#ff6666";
            }
        }

        function showAlert(message) {
            const alertDiv = document.getElementById("system-alert");
            alertDiv.textContent = message;
            alertDiv.classList.add("monitor-alert");
            
            // 5秒后自动隐藏
            setTimeout(() => {
                alertDiv.textContent = "";
                alertDiv.classList.remove("monitor-alert");
            }, 5000);
        }

        async function checkEndpoint(path) {
            try {
                const resp = await fetch(API_BASE + path, { 
                    method: "GET", 
                    cache: "no-cache",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                if (!resp.ok) throw new Error(`HTTP error ${resp.status}`);
                const data = await resp.json();
                return { ok: true, data };
            } catch (e) {
                console.warn(`检查 ${path} 失败:`, e);
                return { ok: false, error: e };
            }
        }

        async function updateSystemStatus() {
            const ts = new Date().toLocaleTimeString();
            document.getElementById("system-timestamp").textContent = ts;

            try {
                const [worker, kv, hb] = await Promise.all([
                    checkEndpoint("ping"),
                    checkEndpoint("kv-test"),
                    checkEndpoint("heartbeat")
                ]);

                // 更新状态显示
                setValue("val-worker", worker.ok ? "✅ 正常" : "❌ 异常", worker.ok);
                setValue("val-kv", kv.ok ? "✅ 正常" : "❌ 异常", kv.ok);
                setValue("val-heart", hb.ok ? "✅ 活跃" : "❌ 离线", hb.ok);
                setValue("val-log", "📝 正常", true);

                // 检查是否有任何异常
                if (!worker.ok || !kv.ok || !hb.ok) {
                    showAlert("⚠️ 系统组件异常，请检查服务状态");
                }

            } catch (e) {
                console.error("更新系统状态时出错:", e);
                showAlert("⚠️ 状态更新失败，请稍后重试");
            }
        }

        // 客服监控功能
        async function fetchSafe(path) {
            try {
                const r = await fetch(API_BASE + path, { 
                    method: "GET", 
                    cache: "no-cache",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                if (!r.ok) throw new Error(`HTTP error ${r.status}`);
                const data = await r.json();
                return data.success ? data.data : null;
            } catch (e) {
                console.warn(`获取客服数据失败 (${path}):`, e);
                return null;
            }
        }

        function renderAgents(agents = [], convSummary = []) {
            const grid = document.getElementById("agent-status");
            const now = new Date().toLocaleTimeString();
            document.getElementById("agent-timestamp").textContent = now;

            if (!agents || agents.length === 0) {
                grid.innerHTML = `
                    <div class="agent-card">
                         <div class="agent-name">⚠️ 无法获取服务数据</div>
                         <div class="agent-meta">请检查 API 连接或稍后重试</div>
                      </div>
                `;
                return;
            }

            grid.innerHTML = agents.map(a => {
                const summary = convSummary.find(c => c.agent_id === a.id);
                const aiRatio = summary ? `${summary.ai_ratio}%` : "--";
                const delay = summary ? `${summary.avg_delay}s` : "--";

                // 去隐私化的最近事件流
                const events = (summary?.events || [])
                    .slice(0, 10)
                    .map(ev => `
                        <div class="timeline-item ${ev.type}">
                            [${ev.time}] ${ev.type === "ai" ? "AI" : "人工"} 回复
                        </div>`).join("");

                return `
                    <div class="agent-card">
                        <div class="agent-name">${a.name || "未知服务"}</div>
                        <div class="agent-meta">
                            状态：${a.online ? "🟢 在线" : "⚫ 离线"}<br>
                            AI比例：${aiRatio}<br>
                            平均延迟：${delay}
                        </div>
                        ${events ? `<div class="timeline">${events}</div>` : ""}
                    </div>
                `;
            }).join("");
        }

        async function updateAgentStatus() {
            try {
                const [agents, summary] = await Promise.all([
                    fetchSafe("agents/status"),
                    fetchSafe("conversations/summary")
                ]);
                renderAgents(agents, summary || []);
            } catch (e) {
                console.error("更新客服状态时出错:", e);
                renderAgents([]);
            }
        }

        // 刷新功能
        function refreshSystemMonitor() {
            updateSystemStatus();
        }

        function refreshAgentMonitor() {
            updateAgentStatus();
        }

        // 启动函数
        function initDashboard() {
            // 初始加载
            updateSystemStatus();
            updateAgentStatus();

            // 设置定时刷新
            systemIntervalId = setInterval(updateSystemStatus, SYSTEM_CHECK_INTERVAL);
            agentIntervalId = setInterval(updateAgentStatus, AGENT_CHECK_INTERVAL);
        }

        // 页面加载完成后初始化
        document.addEventListener("DOMContentLoaded", initDashboard);

        // 清理函数
        window.addEventListener("beforeunload", () => {
            if (systemIntervalId) clearInterval(systemIntervalId);
            if (agentIntervalId) clearInterval(agentIntervalId);
        });
    </script>
</body>
</html>
