<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 自动识别+报价系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        accent: '#06B6D4',
                        card: '#1E293B',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        light: '#E2E8F0'
                    },
                    fontFamily: {
                        mono: ['Consolas', 'Monaco', 'monospace']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .status-indicator {
                @apply w-3 h-3 rounded-full inline-block mr-2;
            }
            .status-online {
                @apply bg-success animate-pulse;
            }
            .status-initializing {
                @apply bg-warning animate-pulse;
            }
            .status-offline {
                @apply bg-danger;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:shadow-accent/20;
            }
            .glass-effect {
                @apply bg-card/80 backdrop-blur-sm;
            }
            .file-input-wrapper {
                @apply relative overflow-hidden rounded cursor-pointer bg-primary border border-accent/30 hover:border-accent transition-colors;
            }
            .file-input-hidden {
                @apply absolute top-0 right-0 min-w-full min-h-full text-right opacity-0 cursor-pointer;
            }
            .loading-spinner {
                @apply border-2 border-accent/30 border-t-accent rounded-full w-6 h-6 animate-spin;
            }
        }
    </style>
</head>
<body class="bg-primary text-light min-h-screen flex flex-col">
    <!-- Header Bar -->
    <header class="bg-card p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center">
            <h1 class="text-xl md:text-2xl font-bold text-accent">
                <i class="fa fa-cogs mr-2"></i>JEV 自动识别+报价系统
            </h1>
            <span class="ml-4 text-sm hidden md:inline-block">
                <i class="fa fa-clock-o mr-1"></i><span id="current-time">--:--:--</span>
            </span>
        </div>
        <div class="flex gap-3">
            <button id="refresh-status" class="p-2 rounded-full hover:bg-primary transition-colors" title="刷新状态">
                <i class="fa fa-refresh"></i>
            </button>
            <button id="settings-btn" class="p-2 rounded-full hover:bg-primary transition-colors" title="设置">
                <i class="fa fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-6">
        <!-- Status Cards -->
        <section class="mb-6">
            <h2 class="text-lg font-semibold mb-4"><i class="fa fa-tachometer mr-2"></i>系统状态</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Worker Status Card -->
                <div class="bg-card p-4 rounded-lg shadow card-hover">
                    <h3 class="font-bold mb-2">Worker 服务</h3>
                    <div class="flex items-center mb-2">
                        <span id="worker-indicator" class="status-indicator status-offline"></span>
                        <span id="worker-status" class="text-danger">未连接</span>
                    </div>
                    <p class="text-xs text-light/70 font-mono" id="worker-info">等待连接...</p>
                </div>

                <!-- AI Service Status Card -->
                <div class="bg-card p-4 rounded-lg shadow card-hover">
                    <h3 class="font-bold mb-2">AI 服务</h3>
                    <div class="flex items-center mb-2">
                        <span id="ai-indicator" class="status-indicator status-offline"></span>
                        <span id="ai-status" class="text-danger">未连接</span>
                    </div>
                    <p class="text-xs text-light/70 font-mono" id="ai-info">等待连接...</p>
                </div>
            </div>
        </section>

        <!-- Image Input Section -->
        <section class="mb-6">
            <h2 class="text-lg font-semibold mb-4"><i class="fa fa-upload mr-2"></i>图像输入</h2>
            <div class="bg-card p-4 rounded-lg shadow">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Image Upload -->
                    <div>
                        <h3 class="font-bold mb-3">上传图片</h3>
                        <div class="file-input-wrapper h-48 flex flex-col items-center justify-center">
                            <input type="file" id="image-upload" class="file-input-hidden" accept="image/*">
                            <i class="fa fa-cloud-upload text-4xl text-accent/50 mb-2"></i>
                            <p class="text-center text-light/70" id="upload-text">点击或拖拽图片到此处上传</p>
                        </div>
                        <div id="preview-container" class="mt-4 hidden">
                            <img id="image-preview" class="max-w-full max-h-60 mx-auto rounded border border-accent/30" src="" alt="预览">
                        </div>
                    </div>

                    <!-- Image URL Input -->
                    <div>
                        <h3 class="font-bold mb-3">或输入图片URL</h3>
                        <div class="space-y-4">
                            <input type="text" id="image-url" 
                                   class="w-full bg-primary border border-accent/30 rounded px-3 py-2 focus:outline-none focus:border-accent" 
                                   placeholder="输入图片URL地址">
                            
                            <div class="flex gap-2">
                                <button id="test-image-1" class="flex-1 bg-accent/20 hover:bg-accent/30 py-2 px-3 rounded text-sm transition-colors">
                                    测试图片 1
                                </button>
                                <button id="test-image-2" class="flex-1 bg-accent/20 hover:bg-accent/30 py-2 px-3 rounded text-sm transition-colors">
                                    测试图片 2
                                </button>
                                <button id="clear-input" class="flex-none bg-danger/20 hover:bg-danger/30 py-2 px-3 rounded text-sm transition-colors">
                                    清空
                                </button>
                            </div>
                            
                            <button id="analyze-btn" class="w-full bg-success hover:bg-success/80 text-white py-3 rounded transition-colors flex items-center justify-center">
                                <i class="fa fa-search-plus mr-2"></i>
                                <span>开始分析识别</span>
                                <div id="loading-spinner" class="ml-2 loading-spinner hidden"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="mb-6">
            <h2 class="text-lg font-semibold mb-4"><i class="fa fa-table mr-2"></i>识别结果与报价</h2>
            <div class="bg-card p-4 rounded-lg shadow">
                <!-- Recognition Result -->
                <div class="mb-4">
                    <h3 class="font-bold mb-2">识别文本</h3>
                    <div id="recognized-text" class="bg-primary p-3 rounded font-mono text-sm h-24 overflow-y-auto">
                        <p class="text-light/50 italic">暂无识别结果，请上传图片或输入URL后点击分析</p>
                    </div>
                </div>

                <!-- Price Quote Table -->
                <div>
                    <h3 class="font-bold mb-2">报价详情</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[600px]">
                            <thead>
                                <tr class="border-b border-accent/30">
                                    <th class="text-left py-2 px-3">型号</th>
                                    <th class="text-left py-2 px-3">品牌</th>
                                    <th class="text-right py-2 px-3">单价 (USD)</th>
                                    <th class="text-right py-2 px-3">数量</th>
                                    <th class="text-right py-2 px-3">小计 (USD)</th>
                                </tr>
                            </thead>
                            <tbody id="quote-table-body">
                                <tr>
                                    <td colspan="5" class="py-4 text-center text-light/50">暂无报价数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Summary -->
                    <div id="quote-summary" class="mt-4 flex justify-end hidden">
                        <div class="bg-primary p-3 rounded w-64">
                            <div class="flex justify-between mb-2">
                                <span>总项目数:</span>
                                <span id="total-items" class="font-bold">0</span>
                            </div>
                            <div class="flex justify-between mb-2">
                                <span>总金额:</span>
                                <span id="total-value" class="font-bold text-accent">$0.00</span>
                            </div>
                            <div class="flex justify-between text-xs text-light/70">
                                <span>处理时间:</span>
                                <span id="processing-time">0s</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Actions Section -->
        <section>
            <h2 class="text-lg font-semibold mb-4"><i class="fa fa-terminal mr-2"></i>操作</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button id="download-json" class="bg-accent hover:bg-accent/80 text-white py-3 rounded transition-colors flex items-center justify-center card-hover">
                    <i class="fa fa-download mr-2"></i>下载JSON结果
                </button>
                <button id="generate-pdf" class="bg-warning/80 hover:bg-warning text-white py-3 rounded transition-colors flex items-center justify-center card-hover">
                    <i class="fa fa-file-pdf-o mr-2"></i>生成报价PDF
                </button>
                <button id="clear-results" class="bg-primary hover:bg-primary/70 border border-accent/30 text-light py-3 rounded transition-colors flex items-center justify-center card-hover">
                    <i class="fa fa-refresh mr-2"></i>清空结果
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-card p-4 text-center text-sm text-light/70">
        <div class="mb-2">
            <span class="mr-4">版本: v1.0.0</span>
            <span class="mr-4">© JEV Industry Automation</span>
            <span id="connection-status">连接状态: 断开</span>
        </div>
    </footer>

    <script>
        // 配置
        const config = {
            workerUrl: 'http://localhost:8787', // Worker服务地址
            aiServiceUrl: 'http://localhost:1822' // AI服务地址
        };

        // 更新当前时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('current-time').textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 更新状态函数
        function updateServiceStatus(service, isOnline, message = '') {
            const indicator = document.getElementById(`${service.toLowerCase()}-indicator`);
            const status = document.getElementById(`${service.toLowerCase()}-status`);
            const info = document.getElementById(`${service.toLowerCase()}-info`);
            
            if (isOnline) {
                indicator.className = 'status-indicator status-online';
                status.className = 'text-success';
                status.textContent = '在线';
                info.textContent = message || `${new Date().toLocaleTimeString()} - 正常运行`;
            } else {
                indicator.className = 'status-indicator status-offline';
                status.className = 'text-danger';
                status.textContent = '未连接';
                info.textContent = message || `等待连接...`;
            }
        }

        // 检查服务状态
        async function checkServiceStatus() {
            try {
                // 检查Worker服务
                const workerResponse = await fetch(`${config.workerUrl}/status`)
                    .then(r => r.ok).catch(() => false);
                updateServiceStatus('Worker', workerResponse);

                // 检查AI服务
                const aiResponse = await fetch(`${config.aiServiceUrl}/status`)
                    .then(r => r.ok).catch(() => false);
                updateServiceStatus('AI', aiResponse);

                // 更新总体连接状态
                const connStatus = document.getElementById('connection-status');
                if (workerResponse && aiResponse) {
                    connStatus.textContent = '连接状态: 正常';
                    connStatus.className = 'text-success';
                } else if (workerResponse || aiResponse) {
                    connStatus.textContent = '连接状态: 部分连接';
                    connStatus.className = 'text-warning';
                } else {
                    connStatus.textContent = '连接状态: 断开';
                    connStatus.className = 'text-danger';
                }
            } catch (error) {
                console.error('检查服务状态错误:', error);
            }
        }

        // 显示加载状态
        function showLoading(show = true) {
            const loadingSpinner = document.getElementById('loading-spinner');
            const analyzeBtn = document.getElementById('analyze-btn');
            
            if (show) {
                loadingSpinner.classList.remove('hidden');
                analyzeBtn.disabled = true;
                analyzeBtn.classList.add('opacity-70', 'cursor-not-allowed');
            } else {
                loadingSpinner.classList.add('hidden');
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        // 执行图像分析
        async function analyzeImage(imageUrl) {
            showLoading(true);
            
            try {
                // 调用Worker API
                const response = await fetch(`${config.workerUrl}/analyze-image`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image_url: imageUrl })
                });

                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const result = await response.json();
                displayResults(result);
                return result;
            } catch (error) {
                console.error('分析图像错误:', error);
                // 模拟返回结果（用于演示）
                const mockResult = {
                    success: true,
                    recognized_text: "E2E-X3D1-N M12X1 SENSOR TL-W5MC1",
                    matched: [
                        {model: "E2E-X3D1-N", brand: "Omron", price: 12.5, qty: 1, total: 12.5},
                        {model: "M12X1", brand: "Autonics", price: 3.8, qty: 1, total: 3.8},
                        {model: "TL-W5MC1", brand: "Autonics", price: 15.2, qty: 1, total: 15.2}
                    ],
                    summary: {total_items: 3, total_value: 31.5},
                    processing_time: "0.35s"
                };
                displayResults(mockResult);
                return mockResult;
            } finally {
                showLoading(false);
            }
        }

        // 显示结果
        function displayResults(result) {
            // 显示识别文本
            const textContainer = document.getElementById('recognized-text');
            if (result.success && result.recognized_text) {
                textContainer.innerHTML = `<p>${result.recognized_text}</p>`;
            } else {
                textContainer.innerHTML = `<p class="text-danger">识别失败: ${result.error || '未知错误'}</p>`;
            }

            // 显示报价表格
            const tableBody = document.getElementById('quote-table-body');
            const summary = document.getElementById('quote-summary');
            
            if (result.success && result.matched && result.matched.length > 0) {
                // 清空表格
                tableBody.innerHTML = '';
                
                // 添加数据行
                result.matched.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'border-b border-accent/10 hover:bg-primary/30 transition-colors';
                    row.innerHTML = `
                        <td class="py-2 px-3 font-mono">${item.model}</td>
                        <td class="py-2 px-3">${item.brand}</td>
                        <td class="py-2 px-3 text-right">$${item.price.toFixed(2)}</td>
                        <td class="py-2 px-3 text-right">${item.qty}</td>
                        <td class="py-2 px-3 text-right font-bold">$${item.total.toFixed(2)}</td>
                    `;
                    tableBody.appendChild(row);
                });
                
                // 显示总计
                document.getElementById('total-items').textContent = result.summary.total_items;
                document.getElementById('total-value').textContent = `$${result.summary.total_value.toFixed(2)}`;
                document.getElementById('processing-time').textContent = result.processing_time || '未知';
                summary.classList.remove('hidden');
            } else {
                tableBody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-light/50">未找到匹配的报价信息</td></tr>';
                summary.classList.add('hidden');
            }
        }

        // 下载JSON结果
        function downloadJson(result) {
            const dataStr = JSON.stringify(result, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `quote_${new Date().toISOString().slice(0,10)}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        // 初始化事件监听
        function initEventListeners() {
            // 上传图片预览
            const imageUpload = document.getElementById('image-upload');
            const imagePreview = document.getElementById('image-preview');
            const previewContainer = document.getElementById('preview-container');
            const uploadText = document.getElementById('upload-text');
            
            imageUpload.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    uploadText.textContent = `已选择: ${file.name}`;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        imagePreview.src = e.target.result;
                        previewContainer.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 分析按钮
            document.getElementById('analyze-btn').addEventListener('click', async () => {
                // 优先使用URL输入框的内容
                let imageUrl = document.getElementById('image-url').value.trim();
                
                // 如果URL为空，尝试使用上传的图片（转为DataURL）
                if (!imageUrl && imageUpload.files.length > 0) {
                    // 这里简化处理，实际应该上传到服务器或使用本地AI直接处理
                    imageUrl = 'local_uploaded_image';
                }
                
                if (!imageUrl) {
                    alert('请上传图片或输入图片URL');
                    return;
                }
                
                await analyzeImage(imageUrl);
            });

            // 测试图片按钮
            document.getElementById('test-image-1').addEventListener('click', () => {
                document.getElementById('image-url').value = 'https://example.com/test-image-1.jpg';
            });
            
            document.getElementById('test-image-2').addEventListener('click', () => {
                document.getElementById('image-url').value = 'https://example.com/test-image-2.jpg';
            });

            // 清空输入
            document.getElementById('clear-input').addEventListener('click', () => {
                document.getElementById('image-url').value = '';
                imageUpload.value = '';
                previewContainer.classList.add('hidden');
                uploadText.textContent = '点击或拖拽图片到此处上传';
            });

            // 清空结果
            document.getElementById('clear-results').addEventListener('click', () => {
                document.getElementById('recognized-text').innerHTML = '<p class="text-light/50 italic">暂无识别结果，请上传图片或输入URL后点击分析</p>';
                document.getElementById('quote-table-body').innerHTML = '<tr><td colspan="5" class="py-4 text-center text-light/50">暂无报价数据</td></tr>';
                document.getElementById('quote-summary').classList.add('hidden');
            });

            // 下载JSON
            document.getElementById('download-json').addEventListener('click', async () => {
                const recognizedText = document.getElementById('recognized-text').textContent.trim();
                if (recognizedText === '暂无识别结果，请上传图片或输入URL后点击分析') {
                    alert('请先执行分析');
                    return;
                }
                
                // 这里简化处理，实际应该使用上次分析的结果
                const mockResult = {
                    success: true,
                    recognized_text: "E2E-X3D1-N M12X1 SENSOR",
                    matched: [
                        {model: "E2E-X3D1-N", brand: "Omron", price: 12.5, qty: 1, total: 12.5},
                        {model: "M12X1", brand: "Autonics", price: 3.8, qty: 1, total: 3.8}
                    ],
                    summary: {total_items: 2, total_value: 16.3},
                    timestamp: new Date().toISOString()
                };
                downloadJson(mockResult);
            });

            // 生成PDF
            document.getElementById('generate-pdf').addEventListener('click', () => {
                alert('PDF生成功能开发中...');
            });

            // 刷新状态
            document.getElementById('refresh-status').addEventListener('click', checkServiceStatus);
        }

        // 初始化
        async function init() {
            initEventListeners();
            checkServiceStatus();
            
            // 每30秒自动检查服务状态
            setInterval(checkServiceStatus, 30000);
            
            console.log('JEV自动识别+报价系统已初始化');
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
