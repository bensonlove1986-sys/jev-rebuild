<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV Client - 登录入口</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        h2 {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: normal;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }
        
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .demo-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            border-left: 4px solid #667eea;
        }
        
        .demo-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🧠</div>
        <h1>JEV Client v7.0</h1>
        <h2>请输入邀请码以登录</h2>
        
        <div class="input-group">
            <label for="invite-code">邀请码</label>
            <input type="text" id="invite-code" placeholder="例如: JEV-6F3K9Q-2025">
        </div>
        
        <button class="btn" id="login-btn">验证并登录</button>
        
        <div id="status-message" class="status-message"></div>
        
        <div class="demo-info">
            <strong>演示模式提示:</strong><br>
            您可以使用任何格式为 <strong>JEV-XXXXX-YYYY</strong> 的邀请码进行测试登录。
            系统将自动验证并跳转到主控台。
        </div>
    </div>
    
    <script>
        // 动态加载邀请码管理器
        const script = document.createElement('script');
        script.src = '../modules/inviteCodeManager.js';
        script.onload = initLogin;
        document.head.appendChild(script);
        
        function initLogin() {
            const loginBtn = document.getElementById('login-btn');
            const inviteCodeInput = document.getElementById('invite-code');
            const statusMessage = document.getElementById('status-message');
            
            loginBtn.addEventListener('click', async () => {
                const inviteCode = inviteCodeInput.value.trim();
                
                if (!inviteCode) {
                    showStatus('请输入邀请码', 'error');
                    return;
                }
                
                showStatus('验证中...', 'success');
                
                try {
                    // 使用邀请码管理器验证
                    const isValid = await verifyInviteCode(inviteCode);
                    
                    if (isValid) {
                        showStatus('验证成功，正在跳转...', 'success');
                        
                        // 保存验证状态
                        localStorage.setItem('jev_invite_verified', 'true');
                        localStorage.setItem('jev_invite_code', inviteCode);
                        
                        // 跳转到主控台
                        setTimeout(() => {
                            window.location.href = '../index.html';
                        }, 1500);
                    } else {
                        showStatus('邀请码无效，请重新输入', 'error');
                    }
                } catch (error) {
                    console.error('验证失败:', error);
                    showStatus('验证过程中出错，请稍后重试', 'error');
                }
            });
            
            // 支持回车键登录
            inviteCodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
            
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message status-${type}`;
                statusMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
