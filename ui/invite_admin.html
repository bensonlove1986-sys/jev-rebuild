<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEV L8.9.6 - 邀请码管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="invite_admin.css">
</head>
<body>
  <!-- 登录模态框 -->
  <div id="loginModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h4>管理员认证</h4>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="adminToken" class="form-label">管理员令牌</label>
          <input type="text" id="adminToken" class="form-control" placeholder="请输入管理员令牌" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="loginButton" class="btn btn-primary">登录</button>
      </div>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="container-fluid min-vh-100 d-flex flex-column">
    <!-- 导航栏 -->
    <nav class="glass-navbar">
      <div class="container">
        <div class="navbar-content">
          <div class="navbar-brand">
            <i class="fa fa-key"></i>
            <span>JEV L8.9.6 - 邀请码管理系统</span>
          </div>
          <div class="navbar-status">
            <div class="connection-indicator">
              <span class="status-dot" id="connection-dot"></span>
              <span id="connection-status">连接中...</span>
            </div>
            <div class="version">v8.9.6</div>
          </div>
        </div>
      </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="flex-grow-1 container py-5">
      <!-- 消息提示区域 -->
      <div id="message-container" class="message-container mb-4" style="display: none;">
        <div class="message-content" id="message-content"></div>
      </div>

      <!-- 登录区域 -->
      <div id="login-container" class="glass-card mb-5">
        <div class="card-header">
          <h3><i class="fa fa-user-circle"></i> 管理员验证</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label for="admin-token" class="form-label">管理员 Token</label>
            <input type="text" id="admin-token" class="form-control" placeholder="输入管理员 Token" value="">
          </div>
          <button id="login-button" class="btn btn-primary w-100">
            <i class="fa fa-sign-in"></i> 登录系统
          </button>
        </div>
      </div>

      <!-- 功能区域（初始隐藏） -->
      <div id="app-container" style="display: none;">
        <!-- 邀请码生成卡片 -->
        <div class="glass-card mb-5">
          <div class="card-header">
            <h3><i class="fa fa-plus-circle"></i> 生成邀请码</h3>
          </div>
          <div class="card-body">
            <div class="row g-4">
              <div class="col-md-3">
                <label for="role" class="form-label">用户角色</label>
                <select id="role" class="form-control">
                  <option value="user">普通用户</option>
                  <option value="agent">代理</option>
                  <option value="admin">管理员</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="count" class="form-label">生成数量</label>
                <input type="number" id="count" class="form-control" min="1" max="100" value="1">
              </div>
              <div class="col-md-3">
                <label for="uses" class="form-label">允许使用次数</label>
                <input type="number" id="uses" class="form-control" min="1" max="100" value="1">
              </div>
              <div class="col-md-3">
                <label for="days" class="form-label">有效期（天）</label>
                <input type="number" id="days" class="form-control" min="1" max="365" value="30">
              </div>
              <div class="col-md-6">
                <label for="prefix" class="form-label">邀请码前缀（可选）</label>
                <input type="text" id="prefix" class="form-control" placeholder="如：VIP" maxlength="5">
              </div>
              <div class="col-md-6">
                <label for="note" class="form-label">备注（可选）</label>
                <input type="text" id="note" class="form-control" placeholder="输入备注信息">
              </div>
              <div class="col-12">
                <button id="generate-button" class="btn btn-primary w-100">
                  <i class="fa fa-refresh"></i> 生成邀请码
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 搜索和导出区域 -->
        <div class="glass-card mb-5">
          <div class="card-body">
            <div class="row g-4">
              <div class="col-md-6">
                <div class="input-group">
                  <input type="text" id="search-input" class="form-control" placeholder="搜索邀请码或角色...">
                  <button id="search-button" class="btn btn-outline-secondary">
                    <i class="fa fa-search"></i>
                  </button>
                </div>
              </div>
              <div class="col-md-6">
                <div class="d-flex gap-2">
                  <button id="refresh-button" class="btn btn-outline-secondary">
                    <i class="fa fa-refresh"></i> 刷新列表
                  </button>
                  <button id="export-button" class="btn btn-outline-secondary">
                    <i class="fa fa-download"></i> 导出CSV
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 邀请码列表 -->
        <div class="glass-card mb-5">
          <div class="card-header">
            <h3><i class="fa fa-list"></i> 邀请码列表</h3>
          </div>
          <div class="card-body">
            <div class="table-container">
              <div id="loading-indicator" class="loading-indicator">
                <div class="spinner"></div>
                <p>加载中...</p>
              </div>
              <table id="invite-table" class="invite-table" style="display: none;">
                <thead>
                  <tr>
                    <th>邀请码</th>
                    <th>角色</th>
                    <th>使用次数</th>
                    <th>过期时间</th>
                    <th>创建时间</th>
                    <th>状态</th>
                    <th>备注</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="invite-list">
                  <!-- 动态生成 -->
                </tbody>
              </table>
              <div id="no-data" class="no-data" style="display: none;">
                <i class="fa fa-info-circle"></i>
                <p>暂无邀请码数据</p>
              </div>
            </div>
            
            <!-- 分页控件 -->
            <div id="pagination" class="pagination mt-4" style="display: none;">
              <div class="pagination-info">
                显示 <span id="start-item">0</span>-<span id="end-item">0</span> 条，共 <span id="total-items">0</span> 条
              </div>
              <div class="pagination-controls">
                <button id="prev-page" class="btn btn-outline-secondary btn-sm" disabled>
                  <i class="fa fa-chevron-left"></i>
                </button>
                <button id="next-page" class="btn btn-outline-secondary btn-sm" disabled>
                  <i class="fa fa-chevron-right"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 审计日志 -->
        <div class="glass-card">
          <div class="card-header">
            <h3><i class="fa fa-history"></i> 最近使用记录</h3>
          </div>
          <div class="card-body">
            <div id="audit-loading" class="loading-indicator">
              <div class="spinner"></div>
              <p>加载中...</p>
            </div>
            <div id="audit-list" class="audit-list">
              <!-- 动态生成 -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 页脚 -->
    <footer class="glass-footer py-3">
      <div class="container text-center">
        <p>&copy; 2025 JEV L8.9.6 - 邀请码管理系统</p>
      </div>
    </footer>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="modal-title">提示</h4>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-message"></p>
      </div>
      <div class="modal-footer">
        <button id="modal-confirm" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 模态框关闭事件 -->
  <script>
    document.querySelector('#loginModal .modal-close').addEventListener('click', () => {
      document.getElementById('loginModal').style.display = 'none';
    });
  </script>
  <script src="invite_admin.js"></script>
</body>
</html>
