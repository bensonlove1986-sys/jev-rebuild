<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV系统 - KV存储功能测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h2 {
            color: #34495e;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        .status-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #3498db;
        }
        
        .status-card.success {
            border-left-color: #27ae60;
        }
        
        .status-card.error {
            border-left-color: #e74c3c;
        }
        
        .status-card.warning {
            border-left-color: #f39c12;
        }
        
        .status-label {
            font-weight: bold;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: monospace;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2980b9;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        
        .btn-warning:hover {
            background: #e67e22;
        }
        
        .result-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .result-content {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-section {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-title {
            font-weight: bold;
            color: #cccccc;
        }
        
        .clear-log {
            background: #444;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .clear-log:hover {
            background: #555;
        }
        
        .log-content {
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .log-info {
            color: #569cd6;
        }
        
        .log-success {
            color: #608b4e;
        }
        
        .log-error {
            color: #f44747;
        }
        
        .log-warning {
            color: #dcdcaa;
        }
        
        .demo-keys {
            background: #e8f4f8;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .demo-keys h4 {
            color: #2c3e50;
            margin-top: 0;
        }
        
        .demo-key-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .demo-key-list li {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #3498db;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .demo-key-list li:hover {
            background: #2980b9;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .status-section {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JEV系统 - KV存储功能测试</h1>
        
        <!-- 状态显示区域 -->
        <h2>KV连接状态</h2>
        <div class="status-section">
            <div class="status-card" id="status-connection">
                <div class="status-label">连接状态</div>
                <div class="status-value">未检测</div>
            </div>
            <div class="status-card" id="status-read">
                <div class="status-label">读取权限</div>
                <div class="status-value">未检测</div>
            </div>
            <div class="status-card" id="status-write">
                <div class="status-label">写入权限</div>
                <div class="status-value">未检测</div>
            </div>
            <div class="status-card" id="status-latency">
                <div class="status-label">响应延迟</div>
                <div class="status-value">-- ms</div>
            </div>
        </div>
        
        <!-- 快速检测按钮 -->
        <div class="button-group">
            <button class="btn-primary" onclick="checkKVStatus()">🔍 检测KV状态</button>
            <button class="btn-warning" onclick="autoFixKV()">🔧 自动修复KV绑定</button>
            <button class="btn-success" onclick="testKVReadWrite()">📝 测试读写功能</button>
        </div>
        
        <!-- 手动操作区域 -->
        <h2>KV手动操作</h2>
        
        <!-- 示例键 -->
        <div class="demo-keys">
            <h4>常用测试键：</h4>
            <ul class="demo-key-list">
                <li onclick="fillKey('ui:last_open_panel')">ui:last_open_panel</li>
                <li onclick="fillKey('system:config')">system:config</li>
                <li onclick="fillKey('service:status')">service:status</li>
                <li onclick="fillKey('demo:test')">demo:test</li>
            </ul>
        </div>
        
        <!-- 键值操作表单 -->
        <div class="form-section">
            <div class="form-group">
                <label for="kv-key">键名 (Key):</label>
                <input type="text" id="kv-key" placeholder="例如: ui:last_open_panel" value="">
            </div>
            
            <div class="form-group">
                <label for="kv-value">值 (Value - JSON格式):</label>
                <textarea id="kv-value" placeholder="{
  \"panel\": \"dashboard\",
  \"timestamp\": 1234567890,
  \"settings\": {
    \"theme\": \"dark\"
  }
}"></textarea>
            </div>
            
            <div class="button-group">
                <button class="btn-primary" onclick="getKVData()">📖 获取数据</button>
                <button class="btn-success" onclick="setKVData()">💾 保存数据</button>
                <button class="btn-danger" onclick="deleteKVData()">🗑️ 删除数据</button>
            </div>
        </div>
        
        <!-- 结果显示区域 -->
        <div class="result-section">
            <div class="result-title">操作结果：</div>
            <div class="result-content" id="operation-result">
                等待操作...
            </div>
        </div>
        
        <!-- 系统日志 -->
        <div class="log-section">
            <div class="log-header">
                <div class="log-title">系统日志</div>
                <button class="clear-log" onclick="clearLogs()">清空日志</button>
            </div>
            <div class="log-content" id="system-logs">
                <span class="log-info">[信息] 页面加载完成，等待测试指令...</span>
            </div>
        </div>
    </div>
    
    <script>
        // 模块导入
        const CONFIG = {
            WORKER_URL: 'https://jevshop.bensonlove1986.workers.dev',
            API_KEY: 'JEV_2025_AI_SYS_A92jskL0xY'
        };
        
        // API模块 - 简化版
        const API = {
            async kvGet(key) {
                try {
                    const url = `${CONFIG.WORKER_URL}/kv/get?key=${encodeURIComponent(key)}`;
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    return await response.json();
                } catch (error) {
                    console.error('KV GET请求失败:', error);
                    return { ok: false, error: error.message };
                }
            },
            
            async kvSet(key, value) {
                try {
                    const url = `${CONFIG.WORKER_URL}/kv/set`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ key, value })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('KV SET请求失败:', error);
                    return { ok: false, error: error.message };
                }
            },
            
            async kvDel(key) {
                try {
                    const url = `${CONFIG.WORKER_URL}/kv/del?key=${encodeURIComponent(key)}`;
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    return await response.json();
                } catch (error) {
                    console.error('KV DEL请求失败:', error);
                    return { ok: false, error: error.message };
                }
            }
        };
        
        // 日志记录功能
        function log(message, type = 'info') {
            const logTypes = {
                info: 'log-info',
                success: 'log-success',
                error: 'log-error',
                warning: 'log-warning'
            };
            
            const timestamp = new Date().toLocaleString('zh-CN');
            const logElement = document.getElementById('system-logs');
            const messageType = type in logTypes ? type : 'info';
            
            logElement.innerHTML += `<div><span class="${logTypes[messageType]}">[${messageType.toUpperCase()}] ${timestamp} - ${message}</span></div>`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // 清空日志
        function clearLogs() {
            document.getElementById('system-logs').innerHTML = '';
            log('日志已清空', 'info');
        }
        
        // 更新操作结果显示
        function updateResult(result) {
            const resultElement = document.getElementById('operation-result');
            if (typeof result === 'object') {
                resultElement.textContent = JSON.stringify(result, null, 2);
            } else {
                resultElement.textContent = result;
            }
        }
        
        // 更新状态卡片
        function updateStatusCard(elementId, status, value) {
            const card = document.getElementById(elementId);
            card.className = 'status-card';
            
            if (status === 'success') {
                card.classList.add('success');
            } else if (status === 'error') {
                card.classList.add('error');
            } else if (status === 'warning') {
                card.classList.add('warning');
            }
            
            const valueElement = card.querySelector('.status-value');
            valueElement.textContent = value;
        }
        
        // 填充键名
        function fillKey(key) {
            document.getElementById('kv-key').value = key;
            log(`已填充键名: ${key}`, 'info');
        }
        
        // 获取KV数据
        async function getKVData() {
            const key = document.getElementById('kv-key').value.trim();
            if (!key) {
                updateResult('请输入键名');
                log('获取失败：键名为空', 'error');
                return;
            }
            
            log(`开始获取KV数据: ${key}`, 'info');
            const startTime = performance.now();
            
            try {
                const result = await API.kvGet(key);
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                
                if (result.ok) {
                    updateResult(result);
                    log(`获取成功: ${key} (延迟: ${latency}ms)`, 'success');
                    
                    // 如果有数据，自动填充到值字段
                    if (result.value !== null && result.value !== undefined) {
                        document.getElementById('kv-value').value = JSON.stringify(result.value, null, 2);
                    }
                } else {
                    updateResult(result);
                    log(`获取失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                updateResult({ error: error.message });
                log(`获取异常: ${error.message}`, 'error');
            }
        }
        
        // 设置KV数据
        async function setKVData() {
            const key = document.getElementById('kv-key').value.trim();
            const valueText = document.getElementById('kv-value').value.trim();
            
            if (!key) {
                updateResult('请输入键名');
                log('保存失败：键名为空', 'error');
                return;
            }
            
            if (!valueText) {
                updateResult('请输入值');
                log('保存失败：值为空', 'error');
                return;
            }
            
            // 验证JSON格式
            let value;
            try {
                value = JSON.parse(valueText);
            } catch (parseError) {
                updateResult(`JSON格式错误: ${parseError.message}`);
                log(`保存失败：JSON格式错误`, 'error');
                return;
            }
            
            log(`开始保存KV数据: ${key}`, 'info');
            const startTime = performance.now();
            
            try {
                const result = await API.kvSet(key, value);
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                
                if (result.ok) {
                    updateResult(result);
                    log(`保存成功: ${key} (延迟: ${latency}ms)`, 'success');
                } else {
                    updateResult(result);
                    log(`保存失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                updateResult({ error: error.message });
                log(`保存异常: ${error.message}`, 'error');
            }
        }
        
        // 删除KV数据
        async function deleteKVData() {
            const key = document.getElementById('kv-key').value.trim();
            if (!key) {
                updateResult('请输入键名');
                log('删除失败：键名为空', 'error');
                return;
            }
            
            if (!confirm(`确定要删除键: ${key} 吗？此操作无法撤销。`)) {
                return;
            }
            
            log(`开始删除KV数据: ${key}`, 'info');
            
            try {
                const result = await API.kvDel(key);
                
                if (result.ok) {
                    updateResult(result);
                    log(`删除成功: ${key}`, 'success');
                    // 清空值字段
                    document.getElementById('kv-value').value = '';
                } else {
                    updateResult(result);
                    log(`删除失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                updateResult({ error: error.message });
                log(`删除异常: ${error.message}`, 'error');
            }
        }
        
        // 检测KV状态
        async function checkKVStatus() {
            log('开始检测KV连接状态...', 'info');
            
            // 重置状态
            updateStatusCard('status-connection', 'info', '检测中...');
            updateStatusCard('status-read', 'info', '检测中...');
            updateStatusCard('status-write', 'info', '检测中...');
            updateStatusCard('status-latency', 'info', '计算中...');
            
            const testKey = 'test:connection_' + Date.now();
            const testValue = { timestamp: Date.now(), test: true };
            let overallStatus = 'success';
            
            try {
                // 测试写入
                const writeStart = performance.now();
                const writeResult = await API.kvSet(testKey, testValue);
                const writeEnd = performance.now();
                const writeLatency = Math.round(writeEnd - writeStart);
                
                if (writeResult.ok) {
                    updateStatusCard('status-write', 'success', '正常');
                    log(`写入测试成功 (延迟: ${writeLatency}ms)`, 'success');
                } else {
                    updateStatusCard('status-write', 'error', '失败');
                    log(`写入测试失败: ${writeResult.error || '未知错误'}`, 'error');
                    overallStatus = 'error';
                }
                
                // 测试读取
                const readStart = performance.now();
                const readResult = await API.kvGet(testKey);
                const readEnd = performance.now();
                const readLatency = Math.round(readEnd - readStart);
                
                if (readResult.ok && readResult.value) {
                    updateStatusCard('status-read', 'success', '正常');
                    log(`读取测试成功 (延迟: ${readLatency}ms)`, 'success');
                } else {
                    updateStatusCard('status-read', 'error', '失败');
                    log(`读取测试失败: ${readResult.error || '未知错误'}`, 'error');
                    overallStatus = 'error';
                }
                
                // 计算总延迟
                const totalLatency = writeLatency + readLatency;
                updateStatusCard('status-latency', 'success', `${totalLatency} ms`);
                
                // 清理测试数据
                await API.kvDel(testKey);
                
                // 更新连接状态
                if (overallStatus === 'success') {
                    updateStatusCard('status-connection', 'success', '已连接');
                    log('KV状态检测完成，所有功能正常', 'success');
                } else {
                    updateStatusCard('status-connection', 'error', '异常');
                }
                
                updateResult({ 
                    status: overallStatus === 'success' ? '正常' : '异常',
                    write_latency: writeLatency,
                    read_latency: readLatency,
                    total_latency: totalLatency
                });
                
            } catch (error) {
                updateStatusCard('status-connection', 'error', '连接失败');
                updateStatusCard('status-read', 'error', '未检测');
                updateStatusCard('status-write', 'error', '未检测');
                updateStatusCard('status-latency', 'error', '-- ms');
                
                updateResult({ error: error.message });
                log(`状态检测异常: ${error.message}`, 'error');
            }
        }
        
        // 自动修复KV绑定
        async function autoFixKV() {
            log('开始尝试自动修复KV绑定...', 'info');
            updateResult('正在执行自动修复流程...');
            
            try {
                // 这里只是模拟修复过程，实际环境中可能需要不同的修复逻辑
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // 重新检测状态
                await checkKVStatus();
                
                log('自动修复完成，请检查状态', 'info');
            } catch (error) {
                updateResult({ error: error.message });
                log(`自动修复失败: ${error.message}`, 'error');
            }
        }
        
        // 测试KV读写功能
        async function testKVReadWrite() {
            const testCases = [
                {
                    key: 'test:ui_state',
                    value: {
                        activeTab: 'dashboard',
                        theme: 'dark',
                        sidebarCollapsed: false,
                        timestamp: Date.now()
                    }
                },
                {
                    key: 'test:system_config',
                    value: {
                        refreshInterval: 30000,
                        defaultView: 'overview',
                        notificationsEnabled: true,
                        version: 'v2.0.0'
                    }
                }
            ];
            
            log('开始执行KV读写测试...', 'info');
            updateResult('执行读写测试中...');
            
            const results = [];
            
            for (const testCase of testCases) {
                try {
                    // 写入测试
                    log(`测试写入: ${testCase.key}`, 'info');
                    const writeResult = await API.kvSet(testCase.key, testCase.value);
                    
                    if (writeResult.ok) {
                        // 读取测试
                        log(`测试读取: ${testCase.key}`, 'info');
                        const readResult = await API.kvGet(testCase.key);
                        
                        if (readResult.ok && readResult.value) {
                            results.push({
                                key: testCase.key,
                                write: 'success',
                                read: 'success',
                                data_match: JSON.stringify(readResult.value) === JSON.stringify(testCase.value)
                            });
                            log(`测试通过: ${testCase.key}`, 'success');
                        } else {
                            results.push({
                                key: testCase.key,
                                write: 'success',
                                read: 'failed',
                                error: readResult.error || '未知错误'
                            });
                            log(`测试失败: ${testCase.key} (读取失败)`, 'error');
                        }
                    } else {
                        results.push({
                            key: testCase.key,
                            write: 'failed',
                            error: writeResult.error || '未知错误'
                        });
                        log(`测试失败: ${testCase.key} (写入失败)`, 'error');
                    }
                } catch (error) {
                    results.push({
                        key: testCase.key,
                        write: 'error',
                        read: 'error',
                        error: error.message
                    });
                    log(`测试异常: ${testCase.key} - ${error.message}`, 'error');
                }
            }
            
            // 清理测试数据
            for (const testCase of testCases) {
                await API.kvDel(testCase.key);
            }
            
            updateResult(results);
            log('KV读写测试完成', 'info');
        }
        
        // 页面加载时自动检测
        window.addEventListener('load', () => {
            log('KV测试页面加载完成', 'info');
            // 3秒后自动检测状态
            setTimeout(() => {
                checkKVStatus();
            }, 1500);
        });
    </script>
</body>
</html>
