<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAOJIE图片采集测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        h1, h2 {
            color: #2196F3;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .test-images {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .test-image {
            width: 200px;
            height: auto;
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .test-image:hover {
            border-color: #2196F3;
            transform: scale(1.05);
        }
        .note {
            background: #fff3cd;
            padding: 10px;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            margin: 15px 0;
        }
        code {
            background: #f8f9fa;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .script-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>DAOJIE图片采集测试页面</h1>
    
    <div class="note">
        <strong>使用说明：</strong>按住 <code>Alt</code> 键并点击下方任意图片，测试图片采集功能。
    </div>

    <div class="test-section">
        <h2>测试图片集合</h2>
        <p>以下是不同类型的测试图片，请尝试使用Alt+点击来处理它们：</p>
        
        <div class="test-images">
            <!-- 内嵌SVG图片 -->
            <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'%3E%3Crect width='200' height='150' fill='%23e3f2fd' stroke='%2390caf9' stroke-width='2'/%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-size='16' text-anchor='middle' dominant-baseline='middle' fill='%231976d2'%3ETest Image 1%3C/text%3E%3C/svg%3E" alt="测试图片1" class="test-image" title="测试图片1 - Alt+点击处理">
            <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'%3E%3Crect width='200' height='150' fill='%23fff3e0' stroke='%23ffb74d' stroke-width='2'/%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-size='16' text-anchor='middle' dominant-baseline='middle' fill='%23e65100'%3ETest Image 2%3C/text%3E%3C/svg%3E" alt="测试图片2" class="test-image" title="测试图片2 - Alt+点击处理">
            <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'%3E%3Crect width='200' height='150' fill='%23e8f5e8' stroke='%2381c784' stroke-width='2'/%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-size='16' text-anchor='middle' dominant-baseline='middle' fill='%232e7d32'%3ETest Image 3%3C/text%3E%3C/svg%3E" alt="测试图片3" class="test-image" title="测试图片3 - Alt+点击处理">
        </div>
    </div>

    <div class="test-section">
        <h2>功能介绍</h2>
        <ul>
            <li>按住Alt键点击图片：触发图片处理流程</li>
            <li>处理后显示：OCR识别结果、翻译结果和上传链接</li>
            <li>支持复制文本、查看详情等操作</li>
        </ul>
    </div>

    <div class="script-info">
        <h3>脚本信息</h3>
        <p><strong>名称：</strong>DAOJIE聊天图片采集</p>
        <p><strong>版本：</strong>2.0.0</p>
        <p><strong>描述：</strong>这是一个简化版本的脚本，包含所有必要功能，可在浏览器中直接使用。</p>
    </div>

    <script>
        // 页面加载完成后的提示
        window.addEventListener('load', function() {
            console.log('测试页面加载完成');
            console.log('请使用Alt+点击图片测试功能');
        });
    </script>
</body>
</html>
