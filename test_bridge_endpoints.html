<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV L6.9 Durable Bridge 测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .test-section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            background: #f9f9f9;
        }
        input, button, textarea {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2980b9;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .response {
            margin-top: 15px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .status {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .credentials {
            background: #fff3cd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ddd;
            border-bottom: none;
            margin-right: 5px;
            border-radius: 4px 4px 0 0;
        }
        .tab.active {
            background: #fff;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>JEV L6.9 Durable Bridge 功能测试</h1>
    
    <div class="credentials">
        <h3>注意事项</h3>
        <p>1. 此页面用于测试部署在 Cloudflare Workers 上的 Durable Bridge 模块</p>
        <p>2. 确保 Worker 已成功部署并运行</p>
        <p>3. 默认使用的令牌为 <code>default_jev_master_key</code>，可根据实际配置修改</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('sync')">会话同步测试</div>
        <div class="tab" onclick="switchTab('report')">报告提交测试</div>
        <div class="tab" onclick="switchTab('auth')">认证测试</div>
    </div>

    <!-- 会话同步测试 -->
    <div id="sync-content" class="tab-content active">
        <div class="test-section">
            <h2>会话同步测试 (/bridge/sync)</h2>
            
            <input type="text" id="sync-url" value="https://jevshop.bensonlove1986.workers.dev/bridge/sync" placeholder="API URL">
            <input type="text" id="sync-token" value="default_jev_master_key" placeholder="X-JEV-Token">
            <input type="text" id="session-id" value="test-session-" placeholder="Session ID">
            
            <textarea id="sync-data" rows="6">{
  "sessionId": "test-session-",
  "memory": {
    "lastMsg": "这是一条测试消息",
    "lang": "zh-CN",
    "context": "test_environment",
    "testTimestamp": ""
  }
}</textarea>
            
            <button id="sync-btn" onclick="testSync()">发送同步请求</button>
            
            <div id="sync-response" class="response">
                <span class="status">响应将显示在这里</span>
            </div>
        </div>
    </div>

    <!-- 报告提交测试 -->
    <div id="report-content" class="tab-content">
        <div class="test-section">
            <h2>报告提交测试 (/bridge/report)</h2>
            
            <input type="text" id="report-url" value="https://jevshop.bensonlove1986.workers.dev/bridge/report" placeholder="API URL">
            <input type="text" id="report-token" value="default_jev_master_key" placeholder="X-JEV-Token">
            
            <textarea id="report-data" rows="8">{
  "synced_sessions": 5,
  "avg_latency_ms": 243,
  "success_rate": 98.7,
  "offline_replays": 1,
  "pending_cache": 0,
  "last_sync": "",
  "timestamp": ""
}</textarea>
            
            <button id="report-btn" onclick="testReport()">发送报告</button>
            
            <div id="report-response" class="response">
                <span class="status">响应将显示在这里</span>
            </div>
        </div>
    </div>

    <!-- 认证测试 -->
    <div id="auth-content" class="tab-content">
        <div class="test-section">
            <h2>无效认证测试</h2>
            
            <input type="text" id="auth-url" value="https://jevshop.bensonlove1986.workers.dev/bridge/sync" placeholder="API URL">
            <input type="text" id="invalid-token" value="invalid_key_123" placeholder="无效的 X-JEV-Token">
            
            <button id="auth-btn" onclick="testInvalidAuth()">发送无效认证请求</button>
            
            <div id="auth-response" class="response">
                <span class="status">响应将显示在这里</span>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // 隐藏所有内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 移除所有标签的活跃状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 激活选中的标签和内容
            document.getElementById(tabName + '-content').classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        async function testSync() {
            const url = document.getElementById('sync-url').value;
            const token = document.getElementById('sync-token').value;
            const sessionId = document.getElementById('session-id').value + Date.now();
            
            let data;
            try {
                data = JSON.parse(document.getElementById('sync-data').value);
                data.sessionId = sessionId;
                data.memory.testTimestamp = new Date().toISOString();
            } catch (e) {
                document.getElementById('sync-response').innerHTML = `
                    <span class="status error">JSON格式错误</span>
                    <pre>${e.message}</pre>
                `;
                return;
            }
            
            const btn = document.getElementById('sync-btn');
            const responseDiv = document.getElementById('sync-response');
            
            btn.classList.add('loading');
            btn.textContent = '发送中...';
            responseDiv.innerHTML = '<span class="status">正在发送请求...</span>';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-JEV-Token': token,
                        'X-Bridge-ID': 'DurableSyncBridge'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                responseDiv.className = 'response ' + (result.success ? 'success' : 'error');
                responseDiv.innerHTML = `
                    <span class="status">HTTP状态: ${response.status}</span>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `
                    <span class="status">请求失败</span>
                    <pre>${error.message}</pre>
                `;
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '发送同步请求';
            }
        }

        async function testReport() {
            const url = document.getElementById('report-url').value;
            const token = document.getElementById('report-token').value;
            
            let data;
            try {
                data = JSON.parse(document.getElementById('report-data').value);
                const now = new Date().toISOString();
                data.last_sync = now;
                data.timestamp = now;
            } catch (e) {
                document.getElementById('report-response').innerHTML = `
                    <span class="status error">JSON格式错误</span>
                    <pre>${e.message}</pre>
                `;
                return;
            }
            
            const btn = document.getElementById('report-btn');
            const responseDiv = document.getElementById('report-response');
            
            btn.classList.add('loading');
            btn.textContent = '发送中...';
            responseDiv.innerHTML = '<span class="status">正在发送请求...</span>';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-JEV-Token': token,
                        'X-Bridge-ID': 'DurableSyncBridge'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                responseDiv.className = 'response ' + (result.success ? 'success' : 'error');
                responseDiv.innerHTML = `
                    <span class="status">HTTP状态: ${response.status}</span>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `
                    <span class="status">请求失败</span>
                    <pre>${error.message}</pre>
                `;
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '发送报告';
            }
        }

        async function testInvalidAuth() {
            const url = document.getElementById('auth-url').value;
            const token = document.getElementById('invalid-token').value;
            
            const data = {
                sessionId: 'test-invalid-auth-' + Date.now(),
                memory: { test: 'invalid' }
            };
            
            const btn = document.getElementById('auth-btn');
            const responseDiv = document.getElementById('auth-response');
            
            btn.classList.add('loading');
            btn.textContent = '发送中...';
            responseDiv.innerHTML = '<span class="status">正在发送请求...</span>';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-JEV-Token': token,
                        'X-Bridge-ID': 'DurableSyncBridge'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                responseDiv.className = 'response ' + (result.success ? 'success' : 'error');
                responseDiv.innerHTML = `
                    <span class="status">HTTP状态: ${response.status}</span>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `
                    <span class="status">请求失败</span>
                    <pre>${error.message}</pre>
                `;
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '发送无效认证请求';
            }
        }

        // 初始化页面
        window.onload = function() {
            console.log('JEV L6.9 Durable Bridge 测试页面已加载');
            
            // 生成默认的session ID
            const defaultSessionId = 'test-session-' + Date.now();
            document.getElementById('session-id').value = 'test-session-';
            
            // 生成时间戳
            const now = new Date().toISOString();
            const syncData = JSON.parse(document.getElementById('sync-data').value);
            syncData.memory.testTimestamp = now;
            document.getElementById('sync-data').value = JSON.stringify(syncData, null, 2);
            
            const reportData = JSON.parse(document.getElementById('report-data').value);
            reportData.last_sync = now;
            reportData.timestamp = now;
            document.getElementById('report-data').value = JSON.stringify(reportData, null, 2);
        };
    </script>
</body>
</html>
