<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 客服任务操作面板</title>
    <style>
        .jev-support-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 340px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            z-index: 9999;
            transition: all 0.3s ease;
        }
        
        .jev-support-header {
            padding: 12px 16px;
            background: rgba(30, 30, 30, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .jev-status-indicators {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .jev-status-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        
        .jev-status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .jev-status-online {
            background-color: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        
        .jev-status-offline {
            background-color: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }
        
        .jev-latency {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .jev-support-actions {
            padding: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .jev-action-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .jev-action-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        
        .jev-action-button:active {
            transform: translateY(0);
        }
        
        .jev-support-results {
            padding: 16px;
            background: rgba(20, 20, 20, 0.8);
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #d1d5db;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .jev-support-results::-webkit-scrollbar {
            width: 4px;
        }
        
        .jev-support-results::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .jev-support-results::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        .jev-result-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .jev-result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .jev-result-time {
            color: #6b7280;
            font-size: 10px;
            margin-bottom: 4px;
        }
        
        .jev-result-content {
            word-break: break-word;
        }
        
        .jev-result-success {
            color: #4ade80;
        }
        
        .jev-result-error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="jevSupportPanel" class="jev-support-panel">
        <div class="jev-support-header">
            <div class="jev-status-indicators">
                <div class="jev-status-item">
                    🧩 Plugin <span id="pluginStatus" class="jev-status-light jev-status-online"></span>
                </div>
                <div class="jev-status-item">
                    ⚙️ Worker <span id="workerStatus" class="jev-status-light jev-status-online"></span>
                </div>
                <div class="jev-status-item">
                    🧠 TRAE <span id="traeStatus" class="jev-status-light jev-status-online"></span>
                </div>
            </div>
            <div id="jevLatency" class="jev-latency">延迟: 42 ms</div>
        </div>
        
        <div class="jev-support-actions">
            <button id="translateBtn" class="jev-action-button">自动翻译</button>
            <button id="analyzeBtn" class="jev-action-button">识图分析</button>
            <button id="quoteBtn" class="jev-action-button">快速报价</button>
        </div>
        
        <div id="jevResults" class="jev-support-results">
            <div class="jev-result-item">
                <div class="jev-result-time">[系统] 面板初始化完成</div>
                <div class="jev-result-content">任务操作面板已就绪，等待执行任务</div>
            </div>
        </div>
        
        <div class="jev-support-actions" style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px;">
            <button id="exportHistoryBtn" class="jev-action-button">📤 导出历史</button>
        </div>
    </div>
    
    <script src="support_task_panel.js"></script>
</body>
</html>
