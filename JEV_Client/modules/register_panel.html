<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 远程客服注册面板</title>
    <style>
        .jev-register-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            z-index: 9999;
            transition: all 0.3s ease;
        }
        
        .jev-register-header {
            padding: 12px 16px;
            background: rgba(30, 30, 30, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .jev-status-indicators {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .jev-status-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        
        .jev-status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .jev-status-online {
            background-color: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        
        .jev-status-offline {
            background-color: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }
        
        .jev-latency {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .jev-register-form {
            padding: 16px;
        }
        
        .jev-form-group {
            margin-bottom: 16px;
        }
        
        .jev-form-label {
            display: block;
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .jev-form-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        
        .jev-form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .jev-register-actions {
            padding: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .jev-action-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .jev-action-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        
        .jev-action-button:active {
            transform: translateY(0);
        }
        
        .jev-action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .jev-register-results {
            padding: 16px;
            background: rgba(20, 20, 20, 0.8);
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
            color: #d1d5db;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .jev-register-results::-webkit-scrollbar {
            width: 4px;
        }
        
        .jev-register-results::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .jev-register-results::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        .jev-result-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .jev-result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .jev-result-time {
            color: #6b7280;
            font-size: 10px;
            margin-bottom: 4px;
        }
        
        .jev-result-content {
            word-break: break-word;
        }
        
        .jev-result-success {
            color: #4ade80;
        }
        
        .jev-result-error {
            color: #ef4444;
        }
        
        .jev-register-status {
            padding: 8px 16px;
            background: rgba(30, 30, 30, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .jev-agent-info {
            font-size: 10px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div id="jevRegisterPanel" class="jev-register-panel">
        <div class="jev-register-header">
            <div class="jev-status-indicators">
                <div class="jev-status-item">
                    🧩 Plugin <span id="pluginStatus" class="jev-status-light jev-status-online"></span>
                </div>
                <div class="jev-status-item">
                    ⚙️ Worker <span id="workerStatus" class="jev-status-light jev-status-online"></span>
                </div>
                <div class="jev-status-item">
                    🧠 TRAE <span id="traeStatus" class="jev-status-light jev-status-online"></span>
                </div>
            </div>
            <div id="jevLatency" class="jev-latency">延迟: 42 ms</div>
        </div>
        
        <div class="jev-register-form">
            <div class="jev-form-group">
                <label class="jev-form-label" for="agentId">客服ID</label>
                <input type="text" id="agentId" class="jev-form-input" placeholder="请输入客服ID">
            </div>
            <div class="jev-form-group">
                <label class="jev-form-label" for="agentName">客服名称</label>
                <input type="text" id="agentName" class="jev-form-input" placeholder="请输入客服名称">
            </div>
            <div class="jev-form-group">
                <label class="jev-form-label" for="agentRegion">所属地区</label>
                <input type="text" id="agentRegion" class="jev-form-input" placeholder="如：IN, BD, CN等">
            </div>
            <div class="jev-form-group">
                <label class="jev-form-label" for="inviteCode">邀请码（可选）</label>
                <input type="text" id="inviteCode" class="jev-form-input" placeholder="输入邀请码（如无则留空）">
            </div>
        </div>
        
        <div class="jev-register-actions">
            <button id="registerBtn" class="jev-action-button">注册客服</button>
            <button id="loginBtn" class="jev-action-button">登录</button>
            <button id="logoutBtn" class="jev-action-button">登出</button>
        </div>
        
        <div id="jevRegisterResults" class="jev-register-results">
            <div class="jev-result-item">
                <div class="jev-result-time">[系统] 面板初始化完成</div>
                <div class="jev-result-content">客服注册面板已就绪，请输入信息进行注册或登录</div>
            </div>
        </div>
        
        <div id="jevAgentStatus" class="jev-register-status">
            <span>未登录</span>
            <span id="jevAgentInfo" class="jev-agent-info"></span>
        </div>
    </div>
    
    <script src="register_panel.js"></script>
</body>
</html>
