<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 远程客服监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: transparent;
            overflow: hidden;
        }
        
        .support-panel {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 320px;
            height: 240px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.3);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            z-index: 9999;
        }
        
        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(45, 212, 191, 0.2);
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px 12px 0 0;
        }
        
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #2dd4bf;
            text-align: center;
        }
        
        .panel-content {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(45, 212, 191, 0.5) rgba(15, 23, 42, 0.8);
        }
        
        .panel-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .panel-content::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 2px;
        }
        
        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(45, 212, 191, 0.5);
            border-radius: 2px;
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 60px 60px 60px 80px;
            gap: 4px;
            padding: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #2dd4bf;
            border-bottom: 1px solid rgba(45, 212, 191, 0.2);
            margin-bottom: 4px;
        }
        
        .agent-row {
            display: grid;
            grid-template-columns: 60px 60px 60px 80px;
            gap: 4px;
            padding: 4px;
            font-size: 11px;
            color: #f8fafc;
            border-radius: 4px;
            margin-bottom: 2px;
            transition: background-color 0.2s ease;
        }
        
        .agent-row:hover {
            background: rgba(45, 212, 191, 0.1);
        }
        
        .agent-row.offline {
            color: #94a3b8;
            background: rgba(100, 116, 139, 0.1);
        }
        
        .status-online {
            color: #4ade80;
        }
        
        .status-offline {
            color: #ef4444;
        }
        
        .ping-normal {
            color: #f8fafc;
        }
        
        .ping-warning {
            color: #facc15;
            font-weight: 600;
        }
        
        .panel-footer {
            padding: 8px 12px;
            border-top: 1px solid rgba(45, 212, 191, 0.2);
            background: rgba(15, 23, 42, 0.8);
            border-radius: 0 0 12px 12px;
            font-size: 11px;
            color: #94a3b8;
        }
        
        .summary-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        
        .last-update {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .support-panel {
                width: 280px;
                height: 220px;
            }
            
            .table-header,
            .agent-row {
                grid-template-columns: 50px 50px 50px 80px;
            }
        }
    </style>
</head>
<body>
    <div class="support-panel">
        <div class="panel-header">
            <h3 class="panel-title">JEV 远程客服监控面板</h3>
        </div>
        
        <div class="panel-content">
            <div class="table-header">
                <div>客服ID</div>
                <div>地区</div>
                <div>状态</div>
                <div>延迟(ms)</div>
            </div>
            
            <div id="agentsList">
                <!-- 客服列表将通过JavaScript动态填充 -->
                <div class="agent-row">
                    <div>加载中...</div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        
        <div class="panel-footer">
            <div class="summary-info">
                <span id="onlineCount">在线客服: 0/0</span>
                <span id="avgLatency">平均延迟: 0ms</span>
            </div>
            <div class="last-update" id="lastUpdate">最后更新: --</div>
        </div>
    </div>
    
    <script src="support_online_panel.js"></script>
</body>
</html>
