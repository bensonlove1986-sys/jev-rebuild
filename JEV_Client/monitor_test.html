<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEV 系统监控测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            margin: 0;
            color: #3b82f6;
            font-size: 28px;
        }
        
        .header p {
            margin: 10px 0 0;
            color: #94a3b8;
        }
        
        .status-section {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-section h2 {
            margin-top: 0;
            color: #60a5fa;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .status-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-card h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #94a3b8;
        }
        
        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .status-label {
            color: #cbd5e1;
        }
        
        .status-value {
            font-weight: 600;
        }
        
        .status-online {
            color: #4ade80;
        }
        
        .status-offline {
            color: #ef4444;
        }
        
        .status-warning {
            color: #facc15;
        }
        
        .action-section {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .action-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .action-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .action-button:active {
            transform: translateY(0);
        }
        
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .iframe-section {
            margin-top: 40px;
        }
        
        .iframe-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .iframe-container {
            height: 500px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .logs-section {
            margin-top: 40px;
        }
        
        .logs-container {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        
        .log-timestamp {
            color: #64748b;
            margin-right: 8px;
        }
        
        .log-info {
            color: #94a3b8;
        }
        
        .log-success {
            color: #4ade80;
        }
        
        .log-error {
            color: #ef4444;
        }
        
        .log-warning {
            color: #facc15;
        }
        
        @media (max-width: 768px) {
            .iframe-grid {
                grid-template-columns: 1fr;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 JEV 系统稳定性监控与远程客服测试平台</h1>
            <p>实时监控 Plugin / Worker / TRAE 三层状态，验证远程客服接入流程</p>
        </div>
        
        <div class="status-section">
            <h2>📊 系统状态监控</h2>
            <div class="status-grid">
                <div class="status-card">
                    <h3>🧩 Plugin 层</h3>
                    <div class="status-info">
                        <span class="status-label">状态:</span>
                        <span id="pluginStatusValue" class="status-value status-online">在线</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">延迟:</span>
                        <span id="pluginLatencyValue" class="status-value">-- ms</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">上次检查:</span>
                        <span id="pluginLastCheck" class="status-value">--</span>
                    </div>
                </div>
                
                <div class="status-card">
                    <h3>⚙️ Worker 层</h3>
                    <div class="status-info">
                        <span class="status-label">状态:</span>
                        <span id="workerStatusValue" class="status-value status-online">在线</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">延迟:</span>
                        <span id="workerLatencyValue" class="status-value">-- ms</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">上次检查:</span>
                        <span id="workerLastCheck" class="status-value">--</span>
                    </div>
                </div>
                
                <div class="status-card">
                    <h3>🧠 TRAE 层</h3>
                    <div class="status-info">
                        <span class="status-label">状态:</span>
                        <span id="traeStatusValue" class="status-value status-online">在线</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">延迟:</span>
                        <span id="traeLatencyValue" class="status-value">-- ms</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">上次检查:</span>
                        <span id="traeLastCheck" class="status-value">--</span>
                    </div>
                </div>
                
                <div class="status-card">
                    <h3>📈 系统健康</h3>
                    <div class="status-info">
                        <span class="status-label">健康评分:</span>
                        <span id="healthScore" class="status-value">--</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">平均延迟:</span>
                        <span id="avgLatency" class="status-value">-- ms</span>
                    </div>
                    <div class="status-info">
                        <span class="status-label">异常重连:</span>
                        <span id="reconnectCount" class="status-value">0</span>
                    </div>
                </div>
            </div>
            
            <div class="action-section">
                <button id="startMonitorBtn" class="action-button">启动监控</button>
                <button id="stopMonitorBtn" class="action-button" disabled>停止监控</button>
                <button id="generateReportBtn" class="action-button">生成健康报告</button>
                <button id="exportDataBtn" class="action-button">导出监控数据</button>
            </div>
        </div>
        
        <div class="iframe-section">
            <h2>🔧 功能面板测试</h2>
            <div class="iframe-grid">
                <div class="iframe-container">
                    <iframe src="modules/register_panel.html" title="客服注册面板"></iframe>
                </div>
                <div class="iframe-container">
                    <iframe src="modules/support_online_panel.html" title="在线客服面板"></iframe>
                </div>
            </div>
        </div>
        
        <div class="logs-section">
            <h2>📝 系统日志</h2>
            <div id="logsContainer" class="logs-container">
                <div class="log-entry">
                    <span class="log-timestamp">[系统初始化]</span>
                    <span class="log-info">正在加载监控模块...</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="jev_three_layer_monitor.js"></script>
    <script>
        // 日志功能
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logsContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const typeClass = `log-${type}`;
            logEntry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="${typeClass}">${message}</span>
            `;
            
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            // 限制日志数量
            if (logsContainer.children.length > 100) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
        }
        
        // 更新状态显示
        function updateStatusDisplay(layerStatus) {
            Object.entries(layerStatus).forEach(([layer, status]) => {
                const statusElement = document.getElementById(`${layer}StatusValue`);
                const latencyElement = document.getElementById(`${layer}LatencyValue`);
                const checkElement = document.getElementById(`${layer}LastCheck`);
                
                if (statusElement) {
                    statusElement.className = `status-value status-${status.status}`;
                    statusElement.textContent = status.status === 'online' ? '在线' : '离线';
                }
                
                if (latencyElement) {
                    latencyElement.textContent = `${status.latency} ms`;
                }
                
                if (checkElement && status.lastCheck) {
                    checkElement.textContent = new Date(status.lastCheck).toLocaleTimeString();
                }
            });
        }
        
        // 更新健康信息
        function updateHealthInfo(report) {
            document.getElementById('healthScore').textContent = report.system_health_score + '/100';
            document.getElementById('avgLatency').textContent = report.latency_avg_ms + ' ms';
            document.getElementById('reconnectCount').textContent = report.reconnect_count;
        }
        
        // 初始化监控
        let jevMonitor = null;
        
        document.getElementById('startMonitorBtn').addEventListener('click', async () => {
            try {
                addLog('启动JEV三层监控...', 'info');
                
                if (!window.JEVThreeLayerMonitor) {
                    throw new Error('监控模块未加载');
                }
                
                jevMonitor = new JEVThreeLayerMonitor();
                const started = jevMonitor.startMonitoring();
                
                if (started) {
                    addLog('监控启动成功 ✅', 'success');
                    document.getElementById('startMonitorBtn').disabled = true;
                    document.getElementById('stopMonitorBtn').disabled = false;
                    
                    // 监听状态更新事件
                    window.addEventListener('jev:statusUpdate', (event) => {
                        updateStatusDisplay(event.detail.layerStatus);
                        addLog(`状态更新: Worker延迟 ${event.detail.averageLatency}ms`, 'info');
                    });
                    
                    // 等待第一次状态检查完成
                    setTimeout(() => {
                        if (jevMonitor) {
                            const summary = jevMonitor.getStatusSummary();
                            addLog(`监控摘要: 健康评分 ${summary.health_score}/100, 延迟 ${summary.average_latency}ms`, 'info');
                        }
                    }, 2500);
                }
            } catch (error) {
                addLog(`监控启动失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('stopMonitorBtn').addEventListener('click', () => {
            try {
                if (jevMonitor) {
                    jevMonitor.stopMonitoring();
                    addLog('监控已停止 ✅', 'success');
                    document.getElementById('startMonitorBtn').disabled = false;
                    document.getElementById('stopMonitorBtn').disabled = true;
                }
            } catch (error) {
                addLog(`停止监控失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('generateReportBtn').addEventListener('click', () => {
            try {
                if (jevMonitor) {
                    addLog('生成系统健康报告...', 'info');
                    const report = jevMonitor.generateHealthReport();
                    updateHealthInfo(report);
                    addLog(`健康报告生成成功: 评分 ${report.system_health_score}/100`, 'success');
                    
                    // 显示报告详情
                    console.log('健康报告详情:', report);
                    alert(`系统健康报告\n\n健康评分: ${report.system_health_score}/100\n平均延迟: ${report.latency_avg_ms}ms\n在线率: ${report.online_rate}%\n异常重连: ${report.reconnect_count}次\n\n所有层状态: ${report.plugin_status}, ${report.worker_status}, ${report.trae_status}`);
                } else {
                    addLog('请先启动监控', 'warning');
                }
            } catch (error) {
                addLog(`生成报告失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('exportDataBtn').addEventListener('click', () => {
            try {
                if (jevMonitor) {
                    addLog('导出监控数据...', 'info');
                    const data = jevMonitor.exportMonitoringData();
                    
                    // 创建下载链接
                    const dataStr = JSON.stringify(data, null, 2);
                    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                    
                    const exportFileDefaultName = `jev_monitor_data_${new Date().toISOString().replace(/[:.]/g, '_')}.json`;
                    
                    const linkElement = document.createElement('a');
                    linkElement.setAttribute('href', dataUri);
                    linkElement.setAttribute('download', exportFileDefaultName);
                    linkElement.click();
                    
                    addLog('监控数据导出成功 ✅', 'success');
                } else {
                    addLog('请先启动监控', 'warning');
                }
            } catch (error) {
                addLog(`导出数据失败: ${error.message}`, 'error');
            }
        });
        
        // 页面加载完成时的初始化
        window.addEventListener('DOMContentLoaded', () => {
            addLog('页面加载完成，监控测试平台就绪', 'info');
            addLog('请点击「启动监控」按钮开始测试', 'info');
            addLog('提示: 客服注册面板和在线客服面板已加载', 'info');
        });
    </script>
</body>
</html>
