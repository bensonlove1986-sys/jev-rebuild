name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm_live_overwrite:
        description: 'Type OVERWRITE to replace live jev-rebuild-worker with this repo bundle'
        required: false
        default: ''

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Do not overwrite the live worker
        run: echo "Push does not deploy worker-core. Live jev-rebuild-worker is patched in place for /api/confirmed-prices."

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_live_overwrite == 'OVERWRITE'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd worker-core
        npm install
    
    - name: Bundle worker code
      run: |
        cd worker-core
        npx esbuild index.js --bundle --format=cjs --outfile=bundle.js
    
    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: worker-core
        command: deploy
    
    - name: Verify deployment
      run: |
        sleep 10
        curl -s -o /dev/null -w "%{http_code}" https://jev-rebuild-worker.bensonlove1986.workers.dev/api/health
