name = "jev-rebuild-worker"
workers_dev = true
main = "index.js"
compatibility_date = "2026-02-03"

# Durable Objects
[durable_objects]
bindings = [
  { name = "WHATSAPP_CHAT_DO", class_name = "WhatsAppChatDO" },
  { name = "CHAT_MEMORY_DO", class_name = "ChatMemoryDO" },
  { name = "JEV_STATE", class_name = "JEV_STATE" },
  { name = "DAOJIE_STREAM_DO", class_name = "DaojieStreamDO" },
  { name = "CHAT_ROOM_DO", class_name = "ChatRoomDO" },
  { name = "DEAL_STATE_DO", class_name = "DEAL_STATE_DO" }
]

# Migrations for Durable Objects
[[migrations]]
tag = "v1"
new_classes = ["WhatsAppChatDO", "ChatMemoryDO", "JEV_STATE", "DaojieStreamDO"]

[[migrations]]
tag = "v2"
new_classes = ["ContactIndexDO"]

[[migrations]]
tag = "v3"
new_classes = ["CHAT_ROOM_DO", "DEAL_STATE_DO"]

[[migrations]]
tag = "v4"
renamed_classes = [{ from = "CHAT_ROOM_DO", to = "ChatRoomDO" }]

# R2 Storage
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jev-media"

[[r2_buckets]]
binding = "JEV_R2"
bucket_name = "jev-r2"

# KV Namespace (will be automatically created or configured in dashboard)
[[kv_namespaces]]
binding = "KV"

[[kv_namespaces]]
binding = "CONTACT_INDEX"
id = "34b95f231c6e4f77a9d7b5e908e8889b"

[[kv_namespaces]]
binding = "TRANSLATION_STORE"
id = "157a12f7a837490b9c6c3d58f0aec9da"

