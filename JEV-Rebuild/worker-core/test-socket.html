<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Socket Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>Engine Socket Test</h1>
    <div>
        <button onclick="connect()">Connect to Engine</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <div class="log" id="log"></div>

    <script>
        let socket = null;
        const log = document.getElementById('log');

        function logMessage(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ': ' + message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function connect() {
            logMessage('Connecting to Engine socket.io server...');
            
            socket = io('http://localhost:3001', {
                path: '/socket.io',
                transports: ['websocket'],
            });

            socket.on('connect', () => {
                logMessage('Connected to Engine! Socket ID: ' + socket.id);
            });

            socket.onAny((event, payload) => {
                logMessage('[UI][ON_ANY] ' + event + ': ' + JSON.stringify(payload));
            });

            socket.on('whatsapp:customers', (data) => {
                logMessage('Received whatsapp:customers: ' + JSON.stringify(data));
            });

            socket.on('whatsapp:status', (data) => {
                logMessage('Received whatsapp:status: ' + JSON.stringify(data));
            });

            socket.on('connect_error', (error) => {
                logMessage('Connection error: ' + error);
            });

            socket.on('disconnect', (reason) => {
                logMessage('Disconnected from Engine: ' + reason);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                logMessage('Disconnecting...');
            }
        }
    </script>
</body>
</html>
