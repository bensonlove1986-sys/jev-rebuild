<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试图片 URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>测试图片 URL</h1>
    
    <div class="test-section">
        <h2>1. 测试图片 URL 是否可访问</h2>
        <input type="text" id="imageUrl" placeholder="输入图片 URL" style="width: 500px; padding: 10px;" value="https://jev-rebuild-worker.bensonlove1986.workers.dev/media/whatsapp/thumb/WA-1698947395427-331053166225059.webp">
        <button onclick="testImageUrl()">测试图片 URL</button>
        <div id="imageResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试 Vision API</h2>
        <input type="text" id="visionImageUrl" placeholder="输入图片 URL" style="width: 500px; padding: 10px;" value="https://jev-rebuild-worker.bensonlove1986.workers.dev/media/whatsapp/thumb/WA-1698947395427-331053166225059.webp">
        <button onclick="testVisionApi()">测试 Vision API</button>
        <div id="visionResult" class="result"></div>
    </div>
    
    <script>
        async function testImageUrl() {
            const imageUrl = document.getElementById('imageUrl').value;
            const resultDiv = document.getElementById('imageResult');
            
            resultDiv.innerHTML = '测试中...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(imageUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'image/*'
                    }
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = `成功！状态码: ${response.status}<br>Content-Type: ${response.headers.get('content-type')}`;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.innerHTML = `失败！状态码: ${response.status}<br>状态: ${response.statusText}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = `错误！${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        async function testVisionApi() {
            const imageUrl = document.getElementById('visionImageUrl').value;
            const resultDiv = document.getElementById('visionResult');
            const apiUrl = 'https://jev-rebuild-worker.bensonlove1986.workers.dev/api/vision/text-detection';
            
            resultDiv.innerHTML = '测试中...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ imageUrl })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `成功！<br>结果: ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.innerHTML = `失败！状态码: ${response.status}<br>结果: ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = `错误！${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
