<!DOCTYPE html>
<html>
<head>
    <title>R2 Access Test</title>
</head>
<body>
    <h1>R2 Access Test</h1>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="uploadFile()">Upload Test Image</button>
    <div id="result"></div>
    
    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('filename', `test-${Date.now()}.${file.name.split('.').pop()}`);
            
            try {
                const response = await fetch('https://jev-rebuild-worker.bensonlove1986.workers.dev/api/upload/image', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                const resultDiv = document.getElementById('result');
                
                if (result.ok) {
                    resultDiv.innerHTML = `
                        <h2>Upload Success</h2>
                        <p>Image URL: <a href="${result.image_url}" target="_blank">${result.image_url}</a></p>
                        <img src="${result.image_url}" alt="Uploaded Image" style="max-width: 400px;">
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2>Upload Failed</h2>
                        <p>Error: ${result.error}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
