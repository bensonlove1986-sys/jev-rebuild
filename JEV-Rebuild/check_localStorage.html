<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查 localStorage 数据</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        h2 {
            color: #555;
            font-size: 18px;
            margin-top: 0;
        }
        pre {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>检查 localStorage 数据</h1>
        
        <div class="section">
            <h2>操作</h2>
            <button onclick="checkLocalStorage()">检查 localStorage 数据</button>
            <button onclick="clearLocalStorage()">清空 localStorage</button>
        </div>
        
        <div class="section">
            <h2>聊天消息 (chat_messages_v1)</h2>
            <pre id="messagesOutput"></pre>
        </div>
        
        <div class="section">
            <h2>聊天 (chat_chats_v1)</h2>
            <pre id="chatsOutput"></pre>
        </div>
        
        <div class="section">
            <h2>草稿 (chat_drafts_v1)</h2>
            <pre id="draftsOutput"></pre>
        </div>
        
        <div class="section">
            <h2>翻译 (chat_translations_v1)</h2>
            <pre id="translationsOutput"></pre>
        </div>
    </div>
    
    <script>
        function checkLocalStorage() {
            try {
                // 检查聊天消息
                const messages = localStorage.getItem('chat_messages_v1');
                document.getElementById('messagesOutput').textContent = messages ? JSON.stringify(JSON.parse(messages), null, 2) : '无数据';
                
                // 检查聊天
                const chats = localStorage.getItem('chat_chats_v1');
                document.getElementById('chatsOutput').textContent = chats ? JSON.stringify(JSON.parse(chats), null, 2) : '无数据';
                
                // 检查草稿
                const drafts = localStorage.getItem('chat_drafts_v1');
                document.getElementById('draftsOutput').textContent = drafts ? JSON.stringify(JSON.parse(drafts), null, 2) : '无数据';
                
                // 检查翻译
                const translations = localStorage.getItem('chat_translations_v1');
                document.getElementById('translationsOutput').textContent = translations ? JSON.stringify(JSON.parse(translations), null, 2) : '无数据';
                
                console.log('localStorage 数据检查完成');
            } catch (error) {
                console.error('检查 localStorage 时出错:', error);
                alert('检查 localStorage 时出错: ' + error.message);
            }
        }
        
        function clearLocalStorage() {
            if (confirm('确定要清空 localStorage 吗？这将删除所有聊天数据。')) {
                try {
                    localStorage.clear();
                    alert('localStorage 已清空');
                    checkLocalStorage();
                } catch (error) {
                    console.error('清空 localStorage 时出错:', error);
                    alert('清空 localStorage 时出错: ' + error.message);
                }
            }
        }
        
        // 页面加载时自动检查
        window.onload = checkLocalStorage;
    </script>
</body>
</html>
