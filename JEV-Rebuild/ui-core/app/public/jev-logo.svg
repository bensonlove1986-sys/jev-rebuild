<svg width="200" height="45" viewBox="0 0 200 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <!-- JEV主渐变 -->
    <linearGradient id="jevGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:1" />
    </linearGradient>
    <!-- 嘉尔威渐变 -->
    <linearGradient id="jalwayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <!-- 装饰渐变 -->
    <linearGradient id="decorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:0.5" />
    </linearGradient>
    <!-- 字体导入 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+SC:wght@700&display=swap');
    </style>
  </defs>
  
  <!-- 主容器 -->
  <g transform="translate(0, 0)">
    <!-- JEV文字 - 英文部分 -->
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="url(#jevGradient)">
      JEV
    </text>
    
    <!-- 中间装饰点 -->
    <circle cx="58" cy="20" r="2" fill="url(#decorGradient)" opacity="0.9"/>
    <circle cx="54" cy="18" r="1.5" fill="url(#decorGradient)" opacity="0.7"/>
    <circle cx="62" cy="22" r="1.5" fill="url(#decorGradient)" opacity="0.7"/>
    
    <!-- 嘉尔威文字 - 中文部分 -->
    <text x="65" y="32" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="url(#jalwayGradient)">
      嘉尔威
    </text>
    
    <!-- 装饰曲线 -->
    <path d="M60 10 Q100 5 140 12" stroke="url(#decorGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" fill="none"/>
    <path d="M60 35 Q100 40 140 33" stroke="url(#decorGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" fill="none"/>
    
    <!-- 底部装饰 -->
    <path d="M150 20 L180 20" stroke="#1890ff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <circle cx="180" cy="20" r="1" fill="#1890ff" opacity="0.7"/>
  </g>
</svg>